[env]
LOOM_WORKSPACE_ROOT = { value = "", relative = true }

# Aliases are string-form: .claude/worktrees/ nest inside the repo, so this file
# merges with the main checkout's copy from a worktree cwd — cargo concatenates
# array values (a doubled alias breaks clippy), strings resolve closest-wins.
# Changing an existing key between string and array form makes that merge fatal
# for every live nested worktree. See docs/agents/concurrent-agents.md.
[alias]
lint = "clippy --workspace --all-targets"

[profile.dev]
# Reduce debug info to line-tables only — still gives backtraces, cuts link time ~40%
debug = "line-tables-only"

# Parallel codegen (faster compile, slightly slower runtime; fine for dev)
codegen-units = 256
