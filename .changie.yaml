changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} on {{.Time.Format "2006-01-02"}}'
fragmentFileFormat: '{{.Kind}}-{{.Custom.Slice}}'
kindFormat: '### {{.Kind}}'
changeFormat: '* {{.Body}}'
body:
  minLength: 8
  maxLength: 180
custom:
  - key: Slice
    label: Fragment slice identifier
    type: string
    minLength: 36
    maxLength: 36
kinds:
  - label: Added
    key: added
  - label: Changed
    key: changed
  - label: Deprecated
    key: deprecated
  - label: Removed
    key: removed
  - label: Fixed
    key: fixed
  - label: Security
    key: security
  - label: Internal
    key: internal
    skipBody: true
    format: '{{- "" -}}'
    changeFormat: '{{- "" -}}'
newlines:
  afterChangelogHeader: 1
  afterKind: 1
  afterChangelogVersion: 1
  beforeKind: 1
  endOfVersion: 1
