    "crates/tokeira-build-info",
    "crates/tokeira-compatibility",
    "crates/tokeira-compatibility-proto",
    "crates/tokeira-compatibility-service",
    "crates/tokeira-conformance",
    "crates/tokeira-conformance-proto",
    "crates/tokeira-conformance-control",
    "crates/tokeira-auth",
    "crates/tokeira-types",
    "crates/tokeira-proto",
    "crates/tokeira-kernel",
    "crates/tokeira-chasm-derive",
    "crates/tokeira-chasm",
    "crates/tokeira-chasm-activity",
    "crates/tokeira-state",
    "crates/tokeira-deployment",
    "crates/tokeira-tkp",
    "crates/tokeira-report",
    "crates/tokeira-explain",
    "crates/tokeira-iac",
    "crates/tokeira-deploy-engine",
    "crates/tokeira-config",
    "crates/tokeira-secrets",
    "crates/tokeira-aws",
    "crates/tokeira-autoscaler",
    "crates/tokeira-remote-workstation",
    "crates/tokeira-orchestrator",
    "crates/tokeira-platform",
    "crates/tokeira-platform-definition",
    "crates/tokeira-k8s",
    "crates/tokeira-compose",
    "crates/tokeira-storage",
    "crates/tokeira-controller",
    "crates/tokeira-observability",
    "crates/tokeira-runtime",
    "crates/tokeira-projection",
    "crates/tokeira-ecs",
    "crates/tokeira-edge",
    "platforms/local",
    "platforms/compose",
    "platforms/ecs",
    "platforms/eks",
    "apps/tkr",
    "apps/tokeirad",
    "apps/tokeira-autoscaler",
    "apps/tokeira-controller",
    "apps/tokeira-bench",
    "crates/dagger-client",
    "crates/tokeira-build",
]
exclude = [
    "scenarios/worker-versioning",
    "scenarios/standalone-activities",
    "spikes/tuf-platform-definition",
    "tools/simulation/engine",
    "tools/simulation/broker",
    "tools/simulation/placement",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["OpenAI"]

[workspace.dependencies]
anyhow = "1.0.103"
async-trait = "0.1"
base64 = "0.22"
bollard = "0.17"
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
dashmap = "6"
eyre = "0.6"
fs2 = "0.4"
# Pure-Rust git SDK for source snapshotting (task 17.1): temp-index write-tree
# equivalent — object/tree/commit writes without touching tree, index, or refs.
gix = { version = "0.85", features = ["tree-editor"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
libc = "0.2"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
metrics-util = "0.19"
mimalloc = { version = "0.1.48", default-features = false }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
prost-reflect = { version = "0.12", features = ["serde"] }
proptest = "1"
# default-features OFF is load-bearing: reqwest's `default-tls` drags
# hyper-tls → native-tls, which is invisible on macOS (Security.framework)
# but dynamically links libssl.so.3 on Linux — and the tokeirad runtime
# image (chainguard glibc-dynamic) ships no OpenSSL. rustls everywhere,
# for real this time; the other defaults are re-enabled explicitly.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "charset",
    "http2",
    "system-proxy",
] }
jsonwebtoken = "9"
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13"
sha2 = "0.10"
tempfile = "3"
# Terminal Markdown rendering for operator reports (operator-explanation D8;
# approved 2026-07-29). The narrative form is deterministic Markdown; termimad
# skins it for TTYs, and pipes receive the raw text.
termimad = "0.35"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1.41", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tonic = { version = "0.11", features = ["transport", "gzip"] }
tonic-reflection = "0.11"
tonic-web = "0.11"
tower-http = { version = "0.4", features = ["cors"] }
url = "2"
uuid = { version = "1.10", features = ["serde", "v4"] }
serde_yaml = "0.9"
# Monty from the tokeira fork: one patch atop the exact upstream revision the
# workspace previously pinned (69f8a613), adding embedder-registered source
# modules — the language-level `import` support .tkdp definition parts stand
# on. Retire the fork for upstream once pydantic/monty ships a module seam
# (pydantic/monty#601 explores the direction). Upstream constraints carry
# over unchanged: crates.io 0.0.19 predates in-sandbox dataclasses
# (pydantic/monty#626); the ruff crates are pinned to the exact line monty
# pins so one parser family exists in the tree; move them only together with
# the monty revision (tkdp-frontend Requirement 8). The lockfile holds
# get-size2 at 0.10.1: 0.10.3 implements GetSize for compact_str 0.10 while
# the ruff 0.0.3 line still uses 0.9, which fails the build — restore after
# an accidental bump with `cargo update -p get-size2 --precise 0.10.1`.
monty = { git = "https://github.com/iw/monty", rev = "8c14091fe6f0b586913cd664b3b127e3cc9c2b43" }
monty-types = { git = "https://github.com/iw/monty", rev = "8c14091fe6f0b586913cd664b3b127e3cc9c2b43" }
ruff_python_ast = "0.0.3"
ruff_python_parser = "0.0.3"
ruff_text_size = "0.0.3"
tokeira-state = { path = "crates/tokeira-state" }
tokeira-deployment = { path = "crates/tokeira-deployment" }
tokeira-tkp = { path = "crates/tokeira-tkp" }
tokeira-iac = { path = "crates/tokeira-iac" }
tokeira-report = { path = "crates/tokeira-report" }
tokeira-explain = { path = "crates/tokeira-explain" }
tokeira-deploy-engine = { path = "crates/tokeira-deploy-engine" }
tokeira-config = { path = "crates/tokeira-config" }
tokeira-aws = { path = "crates/tokeira-aws" }
tokeira-platform = { path = "crates/tokeira-platform" }
tokeira-platform-definition = { path = "crates/tokeira-platform-definition" }
tokeira-secrets = { path = "crates/tokeira-secrets" }
tokeira-k8s = { path = "crates/tokeira-k8s" }
tokeira-observability = { path = "crates/tokeira-observability" }
tokeira-build-info = { path = "crates/tokeira-build-info" }
tokeira-compatibility = { path = "crates/tokeira-compatibility" }
tokeira-compatibility-proto = { path = "crates/tokeira-compatibility-proto" }
tokeira-compatibility-service = { path = "crates/tokeira-compatibility-service" }
tokeira-conformance = { path = "crates/tokeira-conformance" }
tokeira-conformance-proto = { path = "crates/tokeira-conformance-proto" }
tokeira-conformance-control = { path = "crates/tokeira-conformance-control" }
tokeira-auth = { path = "crates/tokeira-auth" }
dagger-client = { path = "crates/dagger-client" }
tokeira-build = { path = "crates/tokeira-build" }
# Deployment-repository machinery (spec-sanctioned dependency additions):
# TUF client/authoring, KMS-held role keys, and the timestamp types tough's
# editor takes. aws-lc-rs is tough's own crypto backend, used only for
# Ed25519 keygen so key material never ships in the tree.
tough = "0.24"
tough-kms = "0.16"
aws-sdk-kms = "1"
aws-lc-rs = "1"
jiff = { version = "0.2", features = ["serde"] }

# Mechanized AGENTS.md rules (§1, §9): prose rules drift under a fluid codebase;
# compiler-enforced ones survive refactors. Everything here is binding. The one
# staged remainder is missing_docs (9,017 sites measured 2026-07-17 — a
# documentation campaign, not a lint flip). clippy::expect_used (measured 574)
# is deliberately NOT adopted: expect-with-invariant-message is this
# workspace's sanctioned unwrap remedy.
[workspace.lints.rust]
unsafe_code = "deny"    # §1 — the four carve-outs carry #[allow] + SAFETY at each site
unreachable_pub = "warn"
missing_debug_implementations = "deny" # §1 — burned down 2026-07-17 (derives + manual impls)

[workspace.lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "deny" # every retained unsafe block carries // SAFETY:
unwrap_used = "deny"    # §1 — burned down 2026-07-18; tests and generated code carry allows
print_stdout = "deny"   # §1 tracing-not-println — CLI/bench/probe crates carry documented allows
print_stderr = "deny"

# The daily release profile favours *diagnosability*: tokeirad runs with
# `panic = "abort"` (a violated fencing or history invariant must die, not limp
# on), so a production abort must yield a resolvable backtrace — symbols kept,
# line tables retained. Overflow checks stay on because a silently wrapped
# counter (a fencing token ordering *below* the floor) is strictly worse than
# an abort.
[profile.release]
lto = "thin"
debug = "line-tables-only"
strip = "none"
overflow-checks = true
panic = "abort"

# Shipped artifacts (provenance-stamped Versioned builds): maximum optimization
# on top of `release`, still unstripped for the same diagnosability reason.
# BuildMode comes from tokeira-build-info, not the cargo profile, so provenance
# semantics are unchanged by which profile builds the binary.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
