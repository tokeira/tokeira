[package]
name = "tkr"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
integration-test = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ecs = "1"
base64 = "0.22"
chrono.workspace = true
clap.workspace = true
console = "0.15"
directories = "6"
indicatif = "0.17"
libc.workspace = true
humantime = "2"
regex = "1"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
toml.workspace = true
toml_edit.workspace = true
tokeira-config.workspace = true
tokeira-aws.workspace = true
tokeira-build-info.workspace = true
tokeira-compatibility.workspace = true
tokeira-remote-workstation = { path = "../../crates/tokeira-remote-workstation" }
tokeira-build.workspace = true
tokeira-deploy-engine = { path = "../../crates/tokeira-deploy-engine" }
tokeira-iac = { path = "../../crates/tokeira-iac" }
tokeira-local-deployment = { path = "../../platforms/local" }
tokeira-compose-deployment = { path = "../../platforms/compose" }
tokeira-ecs-deployment = { path = "../../platforms/ecs" }
tokeira-orchestrator = { path = "../../crates/tokeira-orchestrator" }
tokeira-storage = { path = "../../crates/tokeira-storage", features = ["dsql"] }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
which = "7"

[dev-dependencies]
proptest = "1"
tempfile.workspace = true
