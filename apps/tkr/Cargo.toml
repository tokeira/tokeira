[package]
name = "tkr"
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
integration-test = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aws-config = { version = "1", features = ["behavior-version-latest"] }
dagger-sdk.workspace = true
aws-sdk-ecs = "1"
aws-sdk-s3 = "1"
base64 = "0.22"
chrono.workspace = true
clap.workspace = true
console = "0.15"
directories = "6"
indicatif = "0.17"
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
termimad.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokeira-config.workspace = true
tokeira-aws.workspace = true
tokeira-build-info.workspace = true
tokeira-compatibility.workspace = true
tokeira-build.workspace = true
tokeira-deploy-engine = { path = "../../crates/tokeira-deploy-engine" }
tokeira-iac = { path = "../../crates/tokeira-iac" }
tokeira-local-deployment = { path = "../../platforms/local" }
tokeira-ecs-deployment = { path = "../../platforms/ecs" }
tokeira-orchestrator = { path = "../../crates/tokeira-orchestrator" }
tokeira-platform.workspace = true
# The linked frontends for the standalone `definition check` syntax tier: the
# check runs in-process against the frontend libraries — no provisioner build.
tokeira-platform-definition = { workspace = true, features = ["tkd", "tkdp"] }
tokeira-deployment = { workspace = true }
tokeira-state = { workspace = true }
tokeira-storage = { path = "../../crates/tokeira-storage", features = ["dsql"] }
tokeira-types = { path = "../../crates/tokeira-types" }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
which = "7"

[dev-dependencies]
proptest = "1"
tempfile.workspace = true
# The offline pipeline fakes (mock Dagger engine) for the repository
# integration tests; test builds only.
tokeira-build = { workspace = true, features = ["testing"] }

[lints]
workspace = true
