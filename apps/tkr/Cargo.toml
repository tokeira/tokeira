[package]
name = "tkr"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
integration-test = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aws-config = { version = "1", features = ["behavior-version-latest"] }
chrono.workspace = true
clap.workspace = true
console = "0.15"
directories = "6"
indicatif = "0.17"
libc.workspace = true
humantime = "2"
regex = "1"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokeira-config.workspace = true
tokeira-aws.workspace = true
tokeira-build.workspace = true
tokeira-deploy-engine = { path = "../../crates/tokeira-deploy-engine" }
tokeira-iac = { path = "../../crates/tokeira-iac" }
tokeira-local-deployment = { path = "../../platforms/local" }
tokeira-compose-deployment = { path = "../../platforms/compose" }
tokeira-ecs-deployment = { path = "../../platforms/ecs" }
tokeira-orchestrator = { path = "../../crates/tokeira-orchestrator" }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
which = "7"

[dev-dependencies]
proptest = "1"
tempfile.workspace = true
