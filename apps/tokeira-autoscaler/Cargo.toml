[package]
name = "tokeira-autoscaler-bin"
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tokeira-autoscaler"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
time.workspace = true
tokeira-autoscaler = { path = "../../crates/tokeira-autoscaler" }
tokeira-build-info.workspace = true
tokeira-config.workspace = true
tokeira-observability.workspace = true
tokeira-storage = { path = "../../crates/tokeira-storage", features = ["dsql"] }
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
