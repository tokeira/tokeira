[package]
name = "tokeira-bench"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true

[lib]
name = "tokeira_bench"
path = "src/lib.rs"

[[bin]]
name = "bench-worker"
path = "src/bin/bench_worker.rs"

[[bin]]
name = "bench-starter"
path = "src/bin/bench_starter.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures = "0.3"
futures-util = "0.3"
hdrhistogram = "7.5"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Temporal Rust SDK (v0.4.x). The worker binary needs the full SDK stack;
# the starter binary only strictly needs the client + common crates but
# depending on the whole set keeps the build graph consistent.
temporalio-client = "0.4"
temporalio-common = "0.4"
temporalio-macros = "0.4"
temporalio-sdk = "0.4"
temporalio-sdk-core = "0.4"

[dev-dependencies]
# The v0_4_integration test imports TokeiradHandle from the tokeirad library
# target (apps/tokeirad) so the test exercises the same bootstrap path the
# production binary does.
tokeirad = { path = "../tokeirad" }
# Tonic IntoRequest for direct WorkflowService calls alongside the SDK.
tonic = { workspace = true }
# URL parsing for the in-process server target.
url = "2"
