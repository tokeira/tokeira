[package]
name = "tokeira-bench"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "tokeira_bench"
path = "src/lib.rs"

[[bin]]
name = "bench-worker"
path = "src/bin/bench_worker.rs"

[[bin]]
name = "bench-starter"
path = "src/bin/bench_starter.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures = "0.3"
futures-util = "0.3"
hdrhistogram = "7.5"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Temporal Rust SDK 1.0.0, the same client generation `tokeira-engine` builds
# its callback seam against. The worker binary needs the full SDK stack; the
# starter binary only strictly needs the client crate, but depending on the
# whole set keeps the build graph consistent. The SDK's `experimental` feature
# is what exposes Nexus operations and the raw Core worker the scoped-worker
# integration test drives; `temporalio-sdk-core` is pinned to the exact core
# generation `temporalio-sdk 1.0.0` uses so the lockfile carries one copy.
temporalio-client = "1.0.0"
temporalio-common = "1.0.0"
temporalio-macros = "1.0.0"
temporalio-sdk = { version = "1.0.0", default-features = false, features = ["experimental"] }
temporalio-sdk-core = "0.9.0"
# The 1.0.0 workflow macros expand to paths in this crate.
temporalio-workflow = "1.0.0"

[dev-dependencies]
# The v0_4_integration test imports TokeiradHandle from the tokeirad library
# target (apps/tokeirad) so the test exercises the same bootstrap path the
# production binary does.
tokeirad = { path = "../tokeirad" }
# Tonic IntoRequest for direct WorkflowService calls alongside the SDK.
tonic = { workspace = true }
# URL parsing for the in-process server target.
url = "2"

[lints]
workspace = true
