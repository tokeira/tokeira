[package]
name = "tokeira-controller-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tokeira-controller"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
axum = "0.8"
clap.workspace = true
connectrpc = { version = "0.6", features = ["axum"] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
serde.workspace = true
time.workspace = true
tokeira-config.workspace = true
tokeira-controller = { path = "../../crates/tokeira-controller" }
tokeira-proto = { path = "../../crates/tokeira-proto" }
tokeira-storage = { path = "../../crates/tokeira-storage", features = ["dsql"] }
tokeira-types = { path = "../../crates/tokeira-types" }
tokio.workspace = true
tokio-util = "0.7"
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true
