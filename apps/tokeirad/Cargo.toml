[package]
name = "tokeirad"
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tokeirad"
path = "src/lib.rs"

[[bin]]
name = "tokeirad"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
tokeira-auth.workspace = true
bytes = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
clap.workspace = true
http-body-util.workspace = true
http-body-legacy = { package = "http-body", version = "0.4" }
hyper.workspace = true
hyper-legacy = { package = "hyper", version = "0.14" }
hyper-util.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
mimalloc.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
percent-encoding = "2"
serde_json = "1"
serde.workspace = true
reqwest = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tonic.workspace = true
tonic-reflection.workspace = true
tonic-web.workspace = true
tower-http.workspace = true
tower = "0.4"
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tokeira-edge = { path = "../../crates/tokeira-edge" }
tokeira-build-info.workspace = true
tokeira-chasm = { path = "../../crates/tokeira-chasm" }
tokeira-chasm-activity = { path = "../../crates/tokeira-chasm-activity" }
tokeira-kernel = { path = "../../crates/tokeira-kernel" }
tokeira-observability.workspace = true
tokeira-proto = { path = "../../crates/tokeira-proto" }
tokeira-projection = { path = "../../crates/tokeira-projection", features = ["dsql"] }
tokeira-runtime = { path = "../../crates/tokeira-runtime" }
tokeira-config.workspace = true
tokeira-storage = { path = "../../crates/tokeira-storage", features = ["dsql"] }
tokeira-types = { path = "../../crates/tokeira-types" }
tokeira-conformance-control = { workspace = true, optional = true }
tokeira-conformance = { workspace = true, optional = true }
connectrpc = { version = "0.8.1", features = ["server"], optional = true }
http = "1"

[features]
# Conformance-only: mounts the dynamic-config control service on a separate
# loopback listener and enables the runtime's live override reads. Absent from
# a production build.
conformance = [
    "dep:tokeira-conformance-control",
    "dep:tokeira-conformance",
    "dep:connectrpc",
    "dep:reqwest",
    "tokeira-edge/conformance",
    "tokeira-runtime/conformance",
]

[dev-dependencies]
metrics-util.workspace = true
proptest = "1"
prost = "0.12"
prost-types = "0.12"

[lints]
workspace = true
