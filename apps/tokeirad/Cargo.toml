[package]
name = "tokeirad"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tokeirad"
path = "src/lib.rs"

[[bin]]
name = "tokeirad"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
mimalloc.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
serde_json = "1"
serde.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tonic.workspace = true
tonic-reflection.workspace = true
tonic-web.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tokeira-edge = { path = "../../crates/tokeira-edge" }
tokeira-kernel = { path = "../../crates/tokeira-kernel" }
tokeira-proto = { path = "../../crates/tokeira-proto" }
tokeira-projection = { path = "../../crates/tokeira-projection" }
tokeira-runtime = { path = "../../crates/tokeira-runtime" }
tokeira-config.workspace = true
tokeira-storage = { path = "../../crates/tokeira-storage" }
tokeira-types = { path = "../../crates/tokeira-types" }

[dev-dependencies]
metrics-util.workspace = true
proptest = "1"
prost = "0.12"
prost-types = "0.12"
