# @field policy.nexus_completion.retry_max_attempts | Tokeira native | default=0 | Zero preserves v1.31.0's unbounded retry horizon; positive values impose a safety cap.
# @field policy.nexus_completion.retry_max_interval_ms | stock parity | default=3600000 | Maximum asynchronous Nexus completion retry interval.
# @field policy.nexus_completion.system_callback_url | Tokeira native | default="http://127.0.0.1:7253" | Callback URL that must be reachable from Nexus workers.
