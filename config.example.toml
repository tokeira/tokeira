# Canonical Tokeira production configuration example.
# An empty document is valid; the active values below spell out the same safe defaults.
# Priority remains enabled. User Fairness is disabled unless enable_fairness is true.
# Worker Compute is disabled; enabling it may cause configured providers to create billable capacity.
# The Nexus callback URL must be reachable from Nexus workers; loopback assumes co-location.
# JWT issuer routing requires issuer to exactly equal the token's signed iss value.
# Optional JWT/AWS identity sources are shown commented and are not enabled by this file.

# Complete accepted-field inventory. These generated markers occur once per strict schema leaf.
