# @field policy.nexus_endpoint_limits.external_url_max_length | stock parity | default=4096 | Maximum external Nexus URL length.
# @field policy.nexus_endpoint_limits.list_default_page_size | stock parity | default=100 | Default Nexus endpoint list page size.
# @field policy.nexus_endpoint_limits.list_max_page_size | stock parity | default=1000 | Maximum Nexus endpoint list page size.
# @field policy.nexus_endpoint_limits.name_max_length | stock parity | default=200 | Maximum Nexus endpoint name length.
# @field policy.nexus_endpoint_limits.task_queue_max_length | stock parity | default=1000 | Maximum Nexus worker task-queue name length.
# @field policy.quotas.max_signal_payload_bytes | configured parity | default=4194304 | Maximum admitted signal payload size.
# @field policy.quotas.max_workflow_timeout_seconds | configured parity | default=315360000 | Maximum admitted workflow execution timeout.
# @field policy.task_queues.enable_fairness | configured parity | default=false | Opt in to weighted User Fairness; priority remains enabled.
# @field policy.worker_compute.enabled | Tokeira native | default=false | Enable the experimental remote Worker Compute Controller; configured providers may create billable capacity.

[infrastructure]
cluster_name = "tokeira-local"
region = "us-east-1"
storage = "in-memory"

[infrastructure.dsql]

[infrastructure.placement]
heartbeat_interval_ms = 5000
reconnect_base_delay_ms = 1000
reconnect_max_delay_ms = 30000
node_host = "127.0.0.1"
shard_count = 1
bundle_count = 1
partition_count = 16
hash_version = 1
routing_max_retries = 3

[infrastructure.network]
grpc_addr = "0.0.0.0:7233"
metrics_addr = "0.0.0.0:9090"

[infrastructure.observability]
metrics_enabled = true
otlp_enabled = false
otlp_endpoint = "http://localhost:4317"
otlp_protocol = "grpc"
trace_sample_rate = 1.0
log_format = "text"
log_filter = "info"
leak_detection_deadline_ms = 30000
dashboard_provisioning_enabled = true
smoke_test_timeout_ms = 30000

[infrastructure.observability.otlp_metrics]
enabled = false
protocol = "grpc"
max_buffered_batches = 1024

[infrastructure.observability.alert_thresholds]
dsql_reservoir_exhaustion_ratio = 0.9
dsql_occ_conflict_rate_per_sec = 10.0
projection_checkpoint_lag_seconds = 60
autoscaler_metric_staleness_seconds = 30

[policy]
default_retention_days = 30
namespace_creation = "open"

[policy.quotas]
max_workflow_timeout_seconds = 315360000
max_signal_payload_bytes = 4194304

[policy.compatibility]
enable_standalone_activities = false

[policy.task_queues]
enable_fairness = false

[policy.worker_compute]
enabled = false

[policy.nexus_endpoint_limits]
name_max_length = 200
external_url_max_length = 4096
description_max_size = 20000
task_queue_max_length = 1000
list_default_page_size = 100
list_max_page_size = 1000

[policy.nexus_completion]
http_addr = "127.0.0.1:7253"
system_callback_url = "http://127.0.0.1:7253"
retry_initial_interval_ms = 1000
retry_max_interval_ms = 3600000
retry_backoff_coefficient = 2.0
retry_max_attempts = 0

[policy.http_api]
allowed_hosts = ["*"]
additional_forwarded_headers = []

[capacity.performance]
target_workflow_starts_per_second = 1000
target_p99_wft_latency_ms = 50

[capacity.dsql]
max_connections = 10000
connection_rate_per_second = 100
burst_capacity = 1000

[emergency]
disable_stickiness = false
freeze_projection = false

