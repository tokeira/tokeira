[package]
name = "tokeira-aws"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
tokeira-iac = { workspace = true }
tokeira-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
secrecy = "0.10"
http = "1"
urlencoding = "2"
shlex = "1"
which = "7"

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1"
aws-sdk-eks = "1"
aws-sdk-ecs = "1"
aws-sdk-iam = "1"
aws-sdk-ecr = "1"
aws-sdk-autoscaling = "1"
aws-sdk-ssm = "1"
aws-sdk-s3 = "1"
aws-sdk-dsql = "1"
aws-sdk-dynamodb = "1"
aws-sdk-elasticloadbalancingv2 = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-servicediscovery = "1"
aws-sdk-sts = "1"
aws-iam = "0.2.2"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
