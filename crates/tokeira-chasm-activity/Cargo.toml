[package]
name = "tokeira-chasm-activity"
# The standalone-activity archetype: CHASM component #1. A pure library — state
# enum, transition table, task definitions, validation, config — depending only
# on the substrate (`tokeira-chasm` + the derive macro) and value/wire types. It
# contains NO engine internals (Requirement 1.4): the runtime engine drives it,
# but this crate does not depend on the runtime.
description = "Standalone activity support for the Tokeira durable execution engine"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tokeira", "temporal", "activity"]
categories = ["asynchronous"]
publish = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
prost = "0.12"
postcard = { version = "1.0", features = ["alloc"] }
tokeira-chasm = { path = "../tokeira-chasm", version = "0.1.2" }
tokeira-chasm-derive = { path = "../tokeira-chasm-derive", version = "0.1.2" }
tokeira-types = { path = "../tokeira-types", version = "0.1.2" }
tokeira-proto = { path = "../tokeira-proto", version = "0.1.2" }

[dev-dependencies]
proptest = "1.6"
serde_json.workspace = true

[lints]
workspace = true
