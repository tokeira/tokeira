[package]
name = "tokeira-chasm-derive"
description = "Derive macro for Tokeira durable state-machine components"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tokeira", "derive", "state-machine"]
categories = ["development-tools::procedural-macro-helpers"]
publish = true

[lib]
proc-macro = true

[dependencies]
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
# The macro's shape rules are compile-time contracts (Requirement 3.2-3.5); trybuild
# pins each rejection's message and span, and tokeira-chasm supplies the real trait
# surface so the accept fixtures prove the generated impl against the framework.
trybuild = "1.0"
tokeira-chasm = { path = "../tokeira-chasm", version = "0.1.2" }
prost = "0.12"

[lints]
workspace = true
