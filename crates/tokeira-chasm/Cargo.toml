[package]
name = "tokeira-chasm"
version.workspace = true
edition.workspace = true
license.workspace = true

# Pure CHASM substrate. Dependencies are deliberately confined to value/wire
# types (`tokeira-types`, `tokeira-proto`) plus serde/prost/thiserror. No async,
# I/O, storage, or metrics deps may be added here — that is what keeps this crate
# a pure peer of `tokeira-kernel` (Requirement 1.1, 1.2).
[dependencies]
serde.workspace = true
thiserror.workspace = true
prost = "0.12"
tokeira-types = { path = "../tokeira-types" }
tokeira-proto = { path = "../tokeira-proto" }

[dev-dependencies]
proptest = "1.6"
serde_json.workspace = true
