[package]
name = "tokeira-conformance-proto"
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Buffa/connect-rust bindings for the Tokeira conformance control API (conformance-only)"

[dependencies]
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9.1", features = ["client"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
# Same 0.9 minor line as the connectrpc runtime crate above: the codegen and the
# runtime version in lockstep, and buffa 0.9 output only compiles against a 0.9 runtime.
connectrpc-build = "0.9"
walkdir = "2"

[lints]
workspace = true
