[package]
name = "tokeira-deployment"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
tokeira-state = { workspace = true }
tokeira-build-info = { workspace = true }
tokeira-orchestrator = { path = "../tokeira-orchestrator" }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
# Transitional (deployment-repository spec, restructuring slice): the migrated
# shell modules (config_history, lock, marker) carry their anyhow error chains
# and tokio-driven lock body so behaviour and reports stay byte-identical; the
# operation-lease spec retypes them in their new home.
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tokeira-explain = { workspace = true }
# The deployment repository (deployment-repository spec): TUF machinery,
# S3 residency, KMS-holdable role keys. The mutable timestamp.json breaks
# tokeira-state's immutable-snapshot contract, which is why the repository
# layout lives here and not there.
tough = { workspace = true }
tough-kms = { workspace = true }
aws-sdk-s3 = "1"
aws-lc-rs = { workspace = true }
jiff = { workspace = true }
tokeira-platform = { workspace = true }
tokeira-iac = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
# Publication staging: the TUF editor takes on-disk roots and target files.
tempfile = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Offline S3: a closure-backed HTTP client stands in for the endpoint so the
# whole verification chain runs over the real aws-sdk-s3 request path.
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-smithy-types = "1"
aws-credential-types = { version = "1", features = ["test-util"] }
http = "1"

[lints]
workspace = true
