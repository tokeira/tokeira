[package]
name = "tokeira-edge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dependencies.tokeira-kernel]
path = "../tokeira-kernel"

[dependencies.tokeira-runtime]
path = "../tokeira-runtime"

[dependencies.tokeira-types]
path = "../tokeira-types"
