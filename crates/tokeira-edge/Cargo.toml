[package]
name = "tokeira-edge"
publish = false
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
buffa = { version = "0.6", features = ["json"] }
connectrpc = { version = "0.6", features = ["client"] }
http = "1"
metrics.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
prost = "0.12"
prost-types = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "test-util"] }
tower = "0.4"
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tonic.workspace = true
tracing = "0.1"
tracing-opentelemetry.workspace = true
url = "2"
tokeira-build-info.workspace = true
tokeira-compatibility.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

[dependencies.tokeira-kernel]
path = "../tokeira-kernel"

[dependencies.tokeira-proto]
path = "../tokeira-proto"

[dependencies.tokeira-runtime]
path = "../tokeira-runtime"

[dependencies.tokeira-chasm]
path = "../tokeira-chasm"

[dependencies.tokeira-chasm-activity]
path = "../tokeira-chasm-activity"

[dependencies.tokeira-storage]
path = "../tokeira-storage"

[dependencies.tokeira-types]
path = "../tokeira-types"

[dependencies.tokeira-projection]
path = "../tokeira-projection"

[dev-dependencies]
metrics-util.workspace = true
proptest = "1"
tokeira-types = { path = "../tokeira-types", features = ["test-support"] }
tracing-subscriber.workspace = true
