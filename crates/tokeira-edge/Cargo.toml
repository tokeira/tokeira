[package]
name = "tokeira-edge"
description = "Temporal-compatible gRPC and HTTP API surface for the Tokeira durable execution engine"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tokeira", "temporal", "grpc", "api"]
categories = ["api-bindings", "network-programming"]
publish = true
# Repository-workflow files and property-test corpora stay out of the archive.
exclude = ["AGENTS.md", "CLAUDE.md", "tests/grpc_properties.proptest-regressions"]

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
base64.workspace = true
bytes = "1"
buffa = { version = "0.6", features = ["json"] }
connectrpc = { version = "0.6", features = ["client"] }
http = "1"
http-body-legacy = { package = "http-body", version = "0.4" }
hyper-legacy = { package = "hyper", version = "0.14" }
metrics.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
percent-encoding = "2"
prost = "0.12"
prost-reflect.workspace = true
prost-types = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "test-util"] }
tower = "0.4"
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tonic.workspace = true
tracing = "0.1"
tracing-opentelemetry.workspace = true
url = "2"
tokeira-auth.workspace = true
tokeira-build-info.workspace = true
tokeira-compatibility.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

[dependencies.tokeira-kernel]
path = "../tokeira-kernel"
version = "0.1.1"

[dependencies.tokeira-proto]
path = "../tokeira-proto"
version = "0.1.1"

[dependencies.tokeira-runtime]
path = "../tokeira-runtime"
version = "0.1.1"

[dependencies.tokeira-chasm]
path = "../tokeira-chasm"
version = "0.1.1"

[dependencies.tokeira-chasm-activity]
path = "../tokeira-chasm-activity"
version = "0.1.1"

[dependencies.tokeira-storage]
path = "../tokeira-storage"
version = "0.1.1"

[dependencies.tokeira-types]
path = "../tokeira-types"
version = "0.1.1"

[dependencies.tokeira-projection]
path = "../tokeira-projection"
version = "0.1.1"

[features]
# Compiles the dynamic-override read seam into the admission sites
# (`conformance::overrides`). The override registry itself is test-harness
# machinery this crate never links; the serving application installs read
# functions at boot. Absent from production builds.
conformance = []

[dev-dependencies]
metrics-util.workspace = true
proptest = "1"
# Version-less on purpose: `cargo publish` strips path-only dev-dependencies,
# so the never-published override registry stays test-only.
tokeira-conformance = { path = "../tokeira-conformance" }
tokeira-types = { path = "../tokeira-types", features = ["test-support"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
