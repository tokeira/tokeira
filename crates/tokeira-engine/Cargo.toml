[package]
name = "tokeira-engine"
description = "Embeddable Temporal-compatible durable execution engine"
publish = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/tokeira/tokeira"
readme = "README.md"
keywords = ["temporal", "workflow", "durable-execution", "embedded"]
categories = ["asynchronous", "development-tools"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
tokeira-auth = { path = "../tokeira-auth", version = "0.1.0" }
bytes = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
clap.workspace = true
http-body-util.workspace = true
http-body-legacy = { package = "http-body", version = "0.4" }
hyper.workspace = true
hyper-legacy = { package = "hyper", version = "0.14" }
hyper-util.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
percent-encoding = "2"
serde_json.workspace = true
serde = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
time.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tonic.workspace = true
tonic-reflection.workspace = true
tonic-web.workspace = true
tower-http.workspace = true
tower = "0.4"
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tokeira-edge = { path = "../tokeira-edge", version = "0.1.0" }
tokeira-build-info = { path = "../tokeira-build-info", version = "0.1.0" }
tokeira-chasm = { path = "../tokeira-chasm", version = "0.1.0" }
tokeira-chasm-activity = { path = "../tokeira-chasm-activity", version = "0.1.0" }
tokeira-kernel = { path = "../tokeira-kernel", version = "0.1.0" }
tokeira-managed-dsql = { path = "../tokeira-managed-dsql", version = "0.1.0" }
tokeira-observability = { path = "../tokeira-observability", version = "0.1.0" }
tokeira-proto = { path = "../tokeira-proto", version = "0.1.0" }
tokeira-projection = { path = "../tokeira-projection", version = "0.1.0", features = ["dsql"] }
tokeira-runtime = { path = "../tokeira-runtime", version = "0.1.0" }
tokeira-config = { path = "../tokeira-config", version = "0.1.0" }
tokeira-storage = { path = "../tokeira-storage", version = "0.1.0", features = ["dsql"] }
tokeira-types = { path = "../tokeira-types", version = "0.1.0" }
tokeira-conformance-control = { path = "../tokeira-conformance-control", version = "0.1.0", optional = true }
tokeira-conformance = { path = "../tokeira-conformance", version = "0.1.0", optional = true }
connectrpc = { version = "0.8.1", features = ["server"], optional = true }
http = "1"
temporalio-client = { version = "0.7.0", default-features = false, optional = true }
tonic-sdk = { package = "tonic", version = "0.14", default-features = false, optional = true }

[features]
default = ["temporalio-client"]
temporalio-client = ["dep:temporalio-client", "dep:tonic-sdk"]
# Opt-in SQL integration boundary shared with storage and projection. The live
# managed-cluster test adds a second explicit acknowledgement before AWS mutation.
dsql-integration = [
    "tokeira-projection/dsql-integration",
    "tokeira-storage/dsql-integration",
]
# Conformance-only: mounts the dynamic-config control service on a separate
# loopback listener and enables the runtime's live override reads.
conformance = [
    "dep:tokeira-conformance-control",
    "dep:tokeira-conformance",
    "dep:connectrpc",
    "dep:reqwest",
    "dep:serde",
    "tokeira-edge/conformance",
    "tokeira-runtime/conformance",
]

[dev-dependencies]
metrics-util.workspace = true
prost = "0.12"
prost-types = "0.12"
proptest.workspace = true
url.workspace = true

[lints]
workspace = true
