[package]
name = "tokeira-k8s"
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tokeira-iac = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = "0.3"

# Live Kubernetes access. `client` gives the typed/dynamic `Api`; `ws` is
# required for the port-forward tunnel. We deliberately omit `runtime` (readiness
# uses a short `get_opt` poll loop, not a watcher) and `derive` (no CRD types) to
# keep the dependency surface minimal. `k8s-openapi` is pinned to the `v1_33`
# object set alongside `tokeira-eks-deployment`; keep their versions and API
# features aligned so typed manifests agree across the two crates.
kube = { version = "4.2", features = ["client", "ws"] }
k8s-openapi = { version = "0.28", features = ["v1_33"] }

[dev-dependencies]
http = "1"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util", "retry"] }

[lints]
workspace = true
