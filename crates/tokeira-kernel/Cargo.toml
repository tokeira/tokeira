[package]
name = "tokeira-kernel"
description = "The pure state-transition core of the Tokeira durable execution engine"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tokeira", "temporal", "workflow", "state-machine"]
categories = ["asynchronous"]
publish = true
# Repository-workflow files and property-test corpora stay out of the archive.
exclude = ["AGENTS.md", "CLAUDE.md"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tokeira-types = { path = "../tokeira-types", version = "0.1.2" }

[dev-dependencies]
postcard = { version = "1.0", features = ["alloc"] }
prost = "0.12"
proptest = "1.6"
tokeira-proto = { path = "../tokeira-proto" }
tokeira-types = { path = "../tokeira-types", features = ["test-support"] }

[lints]
workspace = true
