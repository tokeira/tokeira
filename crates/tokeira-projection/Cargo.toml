[package]
name = "tokeira-projection"
description = "Visibility projections and read models for the Tokeira durable execution engine"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tokeira", "temporal", "visibility"]
categories = ["database", "asynchronous"]
publish = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
async-recursion = "1"
base64 = "0.22"
metrics.workspace = true
ordered-float = "4"
serde.workspace = true
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "time", "uuid"], optional = true }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
tokeira-observability.workspace = true
tokeira-storage = { path = "../tokeira-storage", version = "0.1.2" }
tokeira-types = { path = "../tokeira-types", version = "0.1.2" }
uuid.workspace = true

[features]
default = []
dsql = ["dep:sqlx", "tokeira-storage/dsql"]
dsql-integration = ["dsql"]

[dev-dependencies]
metrics-util.workspace = true
proptest = "1"

[lints]
workspace = true
