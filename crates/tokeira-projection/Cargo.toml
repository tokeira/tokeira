[package]
name = "tokeira-projection"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
async-recursion = "1"
base64 = "0.22"
metrics.workspace = true
ordered-float = "4"
serde.workspace = true
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "time", "uuid"], optional = true }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
tokeira-kernel = { path = "../tokeira-kernel" }
tokeira-storage = { path = "../tokeira-storage" }
tokeira-types = { path = "../tokeira-types" }
uuid.workspace = true

[features]
default = []
dsql = ["dep:sqlx", "tokeira-storage/dsql"]
dsql-integration = ["dsql"]

[dev-dependencies]
metrics-util.workspace = true
proptest = "1"
