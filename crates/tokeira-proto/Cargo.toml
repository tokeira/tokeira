[package]
name = "tokeira-proto"
description = "Temporal-compatible and Tokeira-internal protobuf bindings"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tokeira", "temporal", "grpc", "protobuf"]
categories = ["api-bindings", "encoding"]
publish = true

[dependencies]
buffa = { version = "0.6", features = ["json"] }
buffa-types = { version = "0.6", features = ["json"] }
connectrpc = { version = "0.6", features = ["client"] }
http-body = "1"
prost = "0.12"
prost-types = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tonic = { version = "0.11", features = ["transport"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dependencies.tokeira-types]
path = "../tokeira-types"
version = "0.1.2"

[dev-dependencies]
serde_yaml.workspace = true

[lints]
workspace = true
