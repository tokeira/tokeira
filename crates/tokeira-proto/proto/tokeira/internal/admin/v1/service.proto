syntax = "proto3";

package tokeira.internal.admin.v1;

// Internal admin/control plane API.
// This is where runtime-centric operations should live rather than being forced through the
// public Temporal-compatible surface.
service AdminService {
  rpc GetRuntimeStatus(GetRuntimeStatusRequest) returns (GetRuntimeStatusResponse);
  rpc TriggerSweep(TriggerSweepRequest) returns (TriggerSweepResponse);
}

message GetRuntimeStatusRequest {}

message GetRuntimeStatusResponse {
  string node_id = 1;
  uint32 owned_shards = 2;
  uint32 lanes = 3;
  uint32 pending_runs = 4;
  uint32 pending_projections = 5;
}

message TriggerSweepRequest {
  uint32 shard_id = 1;
  uint32 limit = 2;
}

message TriggerSweepResponse {
  uint32 rediscovered_workflow_tasks = 1;
  uint32 rediscovered_activity_tasks = 2;
}
