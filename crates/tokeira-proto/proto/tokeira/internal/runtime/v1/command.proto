syntax = "proto3";

package tokeira.internal.runtime.v1;

import "temporal/api/common/v1/message.proto";

// Internal runtime command envelope.
//
// The important design choice here is that internal runtime commands are *not* the public API.
// They should reflect the actual runtime architecture: routed run mutation, timer wakes,
// activity resolution, and similar engine-native concepts.
message RuntimeCommandEnvelope {
  string request_id = 1;

  oneof command {
    StartRun start_run = 10;
    SignalRun signal_run = 11;
    CompleteWorkflowTask complete_workflow_task = 12;
    TimerDue timer_due = 13;
    ActivityResolved activity_resolved = 14;
  }
}

message RunTarget {
  string namespace = 1;
  string workflow_id = 2;
  string run_id = 3;
  string run_key = 4;
}

message StartRun {
  string namespace = 1;
  string workflow_id = 2;
  string workflow_type = 3;
  string task_queue = 4;
  temporal.api.common.v1.Payloads input = 5;
}

message SignalRun {
  RunTarget target = 1;
  string signal_name = 2;
  temporal.api.common.v1.Payloads input = 3;
  string identity = 4;
}

message CompleteWorkflowTask {
  bytes task_token = 1;
  bytes commands_blob = 2;
  string identity = 3;
}

message TimerDue {
  RunTarget target = 1;
  int64 timer_id = 2;
  int64 due_slot = 3;
}

message ActivityResolved {
  RunTarget target = 1;
  int64 schedule_event_id = 2;
  int32 attempt = 3;
  bool success = 4;
  temporal.api.common.v1.Payloads result = 5;
  string failure_message = 6;
}
