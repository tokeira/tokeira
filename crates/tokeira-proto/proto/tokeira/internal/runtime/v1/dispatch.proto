syntax = "proto3";

package tokeira.internal.runtime.v1;

// Dispatch records are derived from authoritative workflow/activity state transitions.
// They are not the source of truth for correctness.
message ReadyTask {
  TaskKind kind = 1;
  string namespace = 2;
  string task_queue = 3;
  bytes task_token = 4;
  string worker_identity_hint = 5;
  bool sticky = 6;
}

message PollReservation {
  bytes task_token = 1;
  string worker_identity = 2;
  int64 reserved_until_unix_nanos = 3;
}

enum TaskKind {
  TASK_KIND_UNSPECIFIED = 0;
  TASK_KIND_WORKFLOW = 1;
  TASK_KIND_ACTIVITY = 2;
}
