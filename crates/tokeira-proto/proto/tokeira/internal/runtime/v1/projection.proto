syntax = "proto3";

package tokeira.internal.runtime.v1;

// Projection records are emitted from authoritative commits and replayed by projector workers.
// Partition and fanout are explicit because the projection plane only needs deterministic replay
// within each substream rather than one giant global log.
message ProjectionMutationEnvelope {
  uint32 partition_id = 1;
  uint32 fanout = 2;
  int64 commit_slot = 3;
  string run_key = 4;
  int64 transition_seq = 5;
  bytes mutation_blob = 6;
}

message ProjectionCheckpoint {
  uint32 sink_id = 1;
  uint32 partition_id = 2;
  uint32 fanout = 3;
  int64 commit_slot = 4;
  string run_key = 5;
  int64 transition_seq = 6;
}
