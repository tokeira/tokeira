syntax = "proto3";

package temporal.api.common.v1;

// One encoded payload.
// The engine should treat `data` as opaque and should not assume JSON/Protobuf/etc.
message Payload {
  map<string, bytes> metadata = 1;
  bytes data = 2;
}

// Many Temporal-compatible API fields are "payload lists" rather than one scalar payload.
message Payloads {
  repeated Payload payloads = 1;
}

// Header fields attached to commands or tasks.
message Header {
  map<string, Payload> fields = 1;
}

// User-visible memo attached to a workflow execution.
message Memo {
  map<string, Payload> fields = 1;
}

// Search attribute value.
// This is intentionally typed because the canonical Tokeira visibility path is SQL-native.
message SearchAttributeValue {
  oneof kind {
    string keyword = 1;
    KeywordList keyword_list = 2;
    int64 int_value = 3;
    bool bool_value = 4;
    double double_value = 5;
    int64 datetime_unix_nanos = 6;
    string text = 7;
  }
}

message KeywordList {
  repeated string values = 1;
}

message SearchAttributes {
  map<string, SearchAttributeValue> indexed_fields = 1;
}

message WorkflowExecution {
  string workflow_id = 1;
  string run_id = 2;
}

message TaskQueue {
  string name = 1;
}
