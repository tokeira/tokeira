syntax = "proto3";

package temporal.api.enums.v1;

// Public execution status.
// This is intentionally smaller than the full upstream Temporal surface in this starter crate.
enum WorkflowExecutionStatus {
  UNSPECIFIED = 0;
  RUNNING = 1;
  COMPLETED = 2;
  FAILED = 3;
  CANCELED = 4;
  TERMINATED = 5;
  TIMED_OUT = 6;
  CONTINUED_AS_NEW = 7;
}

// Type of a custom search attribute.
enum IndexedValueType {
  INDEXED_VALUE_TYPE_UNSPECIFIED = 0;
  INDEXED_VALUE_TYPE_KEYWORD = 1;
  INDEXED_VALUE_TYPE_KEYWORD_LIST = 2;
  INDEXED_VALUE_TYPE_INT = 3;
  INDEXED_VALUE_TYPE_BOOL = 4;
  INDEXED_VALUE_TYPE_DOUBLE = 5;
  INDEXED_VALUE_TYPE_DATETIME = 6;
  INDEXED_VALUE_TYPE_TEXT = 7;
}
