syntax = "proto3";

package temporal.api.operatorservice.v1;

import "temporal/api/enums/v1/workflow.proto";

// Operator and admin-facing compatibility API.
// The public surface here is intentionally much smaller than full upstream Temporal in this
// starter crate, but it establishes the place where cluster/search-attribute operations belong.
service OperatorService {
  rpc GetClusterInfo(GetClusterInfoRequest) returns (GetClusterInfoResponse);
  rpc AddSearchAttributes(AddSearchAttributesRequest) returns (AddSearchAttributesResponse);
  rpc ListSearchAttributes(ListSearchAttributesRequest) returns (ListSearchAttributesResponse);
}

message GetClusterInfoRequest {}

message GetClusterInfoResponse {
  string cluster_name = 1;
  string server_version = 2;
  bool http_api_enabled = 3;
}

message AddSearchAttributesRequest {
  string namespace = 1;
  map<string, temporal.api.enums.v1.IndexedValueType> custom_attributes = 2;
}

message AddSearchAttributesResponse {}

message ListSearchAttributesRequest {
  string namespace = 1;
}

message ListSearchAttributesResponse {
  map<string, temporal.api.enums.v1.IndexedValueType> system_attributes = 1;
  map<string, temporal.api.enums.v1.IndexedValueType> custom_attributes = 2;
}
