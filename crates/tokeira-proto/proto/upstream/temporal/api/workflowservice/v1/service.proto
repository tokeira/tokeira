syntax = "proto3";

package temporal.api.workflowservice.v1;

import "temporal/api/common/v1/message.proto";
import "temporal/api/enums/v1/workflow.proto";

// Tokeira should preserve the public WorkflowService shape even if its internal runtime
// architecture is dramatically simpler than Temporal's current multi-service split.
service WorkflowService {
  rpc StartWorkflowExecution(StartWorkflowExecutionRequest) returns (StartWorkflowExecutionResponse);
  rpc SignalWorkflowExecution(SignalWorkflowExecutionRequest) returns (SignalWorkflowExecutionResponse);
  rpc PollWorkflowTaskQueue(PollWorkflowTaskQueueRequest) returns (PollWorkflowTaskQueueResponse);
  rpc RespondWorkflowTaskCompleted(RespondWorkflowTaskCompletedRequest) returns (RespondWorkflowTaskCompletedResponse);
  rpc DescribeWorkflowExecution(DescribeWorkflowExecutionRequest) returns (DescribeWorkflowExecutionResponse);
  rpc ListWorkflowExecutions(ListWorkflowExecutionsRequest) returns (ListWorkflowExecutionsResponse);
  rpc CountWorkflowExecutions(CountWorkflowExecutionsRequest) returns (CountWorkflowExecutionsResponse);
}

message StartWorkflowExecutionRequest {
  string namespace = 1;
  string workflow_id = 2;
  string workflow_type = 3;
  temporal.api.common.v1.TaskQueue task_queue = 4;
  temporal.api.common.v1.Payloads input = 5;
  string request_id = 6;
  temporal.api.common.v1.Memo memo = 7;
  temporal.api.common.v1.SearchAttributes search_attributes = 8;
}

message StartWorkflowExecutionResponse {
  string run_id = 1;
}

message SignalWorkflowExecutionRequest {
  string namespace = 1;
  string workflow_id = 2;
  string run_id = 3;
  string signal_name = 4;
  temporal.api.common.v1.Payloads input = 5;
  string request_id = 6;
  string identity = 7;
}

message SignalWorkflowExecutionResponse {}

message PollWorkflowTaskQueueRequest {
  string namespace = 1;
  temporal.api.common.v1.TaskQueue task_queue = 2;
  string identity = 3;
  string deployment = 4;
  string build_id = 5;
}

message PollWorkflowTaskQueueResponse {
  bytes task_token = 1;
  temporal.api.common.v1.WorkflowExecution workflow_execution = 2;
  int64 started_event_id = 3;
  bytes history_blob = 4;
  bool sticky = 5;
}

message RespondWorkflowTaskCompletedRequest {
  bytes task_token = 1;
  repeated Command commands = 2;
  string identity = 3;
}

message RespondWorkflowTaskCompletedResponse {
  bool workflow_completed = 1;
  string new_run_id = 2;
}

message Command {
  oneof attributes {
    ScheduleActivityCommandAttributes schedule_activity = 1;
    StartTimerCommandAttributes start_timer = 2;
    UpsertSearchAttributesCommandAttributes upsert_search_attributes = 3;
    UpsertMemoCommandAttributes upsert_memo = 4;
    CompleteWorkflowExecutionCommandAttributes complete_workflow = 5;
    FailWorkflowExecutionCommandAttributes fail_workflow = 6;
  }
}

message ScheduleActivityCommandAttributes {
  string activity_id = 1;
  temporal.api.common.v1.TaskQueue task_queue = 2;
  temporal.api.common.v1.Payloads input = 3;
}

message StartTimerCommandAttributes {
  string timer_id = 1;
  int64 delay_millis = 2;
}

message UpsertSearchAttributesCommandAttributes {
  temporal.api.common.v1.SearchAttributes search_attributes = 1;
}

message UpsertMemoCommandAttributes {
  temporal.api.common.v1.Memo memo = 1;
}

message CompleteWorkflowExecutionCommandAttributes {
  temporal.api.common.v1.Payloads result = 1;
}

message FailWorkflowExecutionCommandAttributes {
  string message = 1;
  temporal.api.common.v1.Payloads details = 2;
}

message DescribeWorkflowExecutionRequest {
  string namespace = 1;
  string workflow_id = 2;
  string run_id = 3;
}

message DescribeWorkflowExecutionResponse {
  WorkflowExecutionInfo execution = 1;
}

message ListWorkflowExecutionsRequest {
  string namespace = 1;
  string query = 2;
  int32 page_size = 3;
  bytes next_page_token = 4;
}

message ListWorkflowExecutionsResponse {
  repeated WorkflowExecutionInfo executions = 1;
  bytes next_page_token = 2;
}

message CountWorkflowExecutionsRequest {
  string namespace = 1;
  string query = 2;
  repeated string group_by = 3;
}

message CountWorkflowExecutionsResponse {
  int64 count = 1;
  repeated CountGroup groups = 2;
}

message CountGroup {
  string group_value = 1;
  int64 count = 2;
}

message WorkflowExecutionInfo {
  string namespace = 1;
  string workflow_id = 2;
  string run_id = 3;
  string workflow_type = 4;
  temporal.api.common.v1.TaskQueue task_queue = 5;
  temporal.api.enums.v1.WorkflowExecutionStatus status = 6;
  int64 start_time_unix_nanos = 7;
  optional int64 execution_time_unix_nanos = 8;
  optional int64 close_time_unix_nanos = 9;
  int64 history_length = 10;
  int64 state_transition_count = 11;
  temporal.api.common.v1.Memo memo = 12;
  temporal.api.common.v1.SearchAttributes search_attributes = 13;
}
