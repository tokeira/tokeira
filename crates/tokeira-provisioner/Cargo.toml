[package]
name = "tokeira-provisioner"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
tokeira-state = { workspace = true }
tokeira-build-info = { workspace = true }
tokeira-orchestrator = { path = "../tokeira-orchestrator" }
tokeira-platform = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }

[lints]
workspace = true
