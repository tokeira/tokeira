[package]
name = "tokeira-remote-workstation"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Remote workstation lifecycle — module composition, bootstrap, and operational methods"

[dependencies]
tokeira-iac = { path = "../tokeira-iac" }
tokeira-aws = { path = "../tokeira-aws" }
tokeira-state = { path = "../tokeira-state" }

# AWS SDK (for operational methods: SSM remote-exec, instance start/stop)
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1"
aws-sdk-iam = "1"
aws-sdk-ssm = "1"

# Core
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
which = "7"

[dev-dependencies]
proptest = "1"
