[package]
name = "tokeira-runtime"
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
buffa = { version = "0.6", features = ["json"] }
buffa-types = { version = "0.6", features = ["json"] }
chrono.workspace = true
chrono-tz.workspace = true
connectrpc = { version = "0.6", features = ["client"] }
dashmap.workspace = true
metrics.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
percent-encoding = "2"
prost-types = "0.12"
reqwest.workspace = true
url = "2"
serde.workspace = true
serde_json = "1"
smallvec.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tonic.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
tokeira-kernel = { path = "../tokeira-kernel" }
tokeira-observability = { path = "../tokeira-observability" }
tokeira-projection = { path = "../tokeira-projection" }
tokeira-proto = { path = "../tokeira-proto" }
tokeira-storage = { path = "../tokeira-storage" }
tokeira-types = { path = "../tokeira-types" }
tokeira-chasm = { path = "../tokeira-chasm" }
tokeira-conformance = { workspace = true, optional = true }
prost = "0.12"

[features]
# Conformance-only: pulls in the override registry so the reported-problems
# threshold (and future wired keys) is read live. Absent from production builds.
conformance = ["dep:tokeira-conformance"]

[dev-dependencies]
metrics-util.workspace = true
proptest = "1"
prost = "0.12"
tokio-util = { version = "0.7", features = ["rt"] }
tokeira-proto = { path = "../tokeira-proto" }
tokeira-types = { path = "../tokeira-types", features = ["test-support"] }
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true
