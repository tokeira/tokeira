[package]
name = "tokeira-runtime"
description = "Task dispatch and execution runtime for the Tokeira durable execution engine"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tokeira", "temporal", "workflow", "runtime"]
categories = ["asynchronous", "concurrency"]
publish = true
# Repository-workflow files and property-test corpora stay out of the archive.
exclude = ["AGENTS.md", "CLAUDE.md", "proptest-regressions"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
buffa = { version = "0.6", features = ["json"] }
buffa-types = { version = "0.6", features = ["json"] }
chrono.workspace = true
chrono-tz.workspace = true
connectrpc = { version = "0.6", features = ["client"] }
dashmap.workspace = true
metrics.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
percent-encoding = "2"
prost-types = "0.12"
reqwest.workspace = true
url = "2"
serde.workspace = true
serde_json = "1"
smallvec.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tonic.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
tokeira-kernel = { path = "../tokeira-kernel", version = "0.1.2" }
tokeira-observability = { path = "../tokeira-observability", version = "0.1.2" }
tokeira-projection = { path = "../tokeira-projection", version = "0.1.2" }
tokeira-proto = { path = "../tokeira-proto", version = "0.1.2" }
tokeira-storage = { path = "../tokeira-storage", version = "0.1.2" }
tokeira-types = { path = "../tokeira-types", version = "0.1.2" }
tokeira-chasm = { path = "../tokeira-chasm", version = "0.1.2" }
prost = "0.12"

[features]
# Compiles the dynamic-override read seam (`conformance`) into the wired
# admission sites. The override registry itself is test-harness machinery this
# crate never links; the serving application installs read functions at boot.
# Absent from production builds.
conformance = []

[dev-dependencies]
# Version-less on purpose: `cargo publish` strips path-only dev-dependencies,
# so the never-published override registry stays test-only.
tokeira-conformance = { path = "../tokeira-conformance" }
metrics-util.workspace = true
proptest = "1"
prost = "0.12"
tokio-util = { version = "0.7", features = ["rt"] }
tokeira-proto = { path = "../tokeira-proto" }
tokeira-types = { path = "../tokeira-types", features = ["test-support"] }
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true
