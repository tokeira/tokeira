# cargo-deny — Tokeira supply-chain and license posture.
#
# Run locally with `cargo deny check`; enforced in CI (.github/workflows/ci.yml).
# Schema reference: https://embarkstudios.github.io/cargo-deny/
#
# Tokeira is a from-scratch durable-execution engine specialised for Aurora DSQL.
# Its correctness and isolation guarantees rest on a large transitive tree (tonic,
# prost, sqlx, the AWS SDK, connectrpc). We fail the build on known
# vulnerabilities, untrusted sources, and any license outside an explicit allowlist.

[advisories]
# RustSec advisory DB (default source). An active vulnerability fails the check.
# The entries below are transitive advisories with no upstream fix available; each
# is a non-vulnerability (unmaintained crate, or a niche unsoundness Tokeira's code
# does not exercise) pulled in deep in the tree. Revisit when the upstream
# dependency updates.
ignore = [
    # `atomic-polyfill` reaches the all-target graph only through heapless 0.7,
    # which only Postcard's `heapless-cas` default enables. Every workspace
    # manifest turns that default off; the one remaining enabler is the pinned
    # Monty fork's Postcard dependency. Drop this entry when the Monty pin moves
    # to a revision without the default.
    "RUSTSEC-2023-0089", # `atomic-polyfill` unmaintained (transitive, via monty -> postcard)
    "RUSTSEC-2026-0097", # `rand` unsoundness in a custom-logger pattern Tokeira does not use
    # rustls-webpki 0.101.7 rides aws-smithy-runtime's legacy `tls-rustls`
    # connector (hyper 0.14 + rustls 0.21). No workspace manifest enables that
    # feature any more; the one remaining enabler is aurora-dsql-sqlx-connector
    # 0.1.2, which takes aws-sdk-dsql's defaults. The advisories concern
    # certificate name-constraint validation and CRL parsing on connections to
    # AWS service endpoints. Drop these three when the connector pin moves to a
    # release without the service defaults (0.2.x, which needs SQLx 0.9).
    "RUSTSEC-2026-0098", # rustls-webpki: name constraints for URI names
    "RUSTSEC-2026-0099", # rustls-webpki: name constraints for wildcard certs
    "RUSTSEC-2026-0104", # rustls-webpki: reachable panic in CRL parsing
    # h2 0.3.27 is the final release of the EOL 0.3 line; the fix ships only in
    # 0.4.16+. The one remaining parent is the legacy AWS client stack above,
    # which acts only as an HTTPS client to AWS service endpoints, so the
    # unbounded empty-DATA-frame flaw has no untrusted peer; every server
    # surface runs h2 0.4 (tonic 0.14 / hyper 1). Drop this entry with the
    # rustls-webpki ones when the connector pin moves.
    "RUSTSEC-2026-0258", # h2 0.3: unbounded empty DATA frames (client-only legacy AWS stack)
]

[licenses]
# Deny-by-default: every crate in the tree must resolve to one of these SPDX ids.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "0BSD",
]
confidence-threshold = 0.9
# Per-crate license exceptions, each justified, go here as the tree requires them.
exceptions = [
    # webpki-roots and webpki-root-certs bundle Mozilla's CA certificate set
    # under the data-only CDLA-Permissive-2.0 license; both crates' own code is
    # permissive. (webpki-root-certs arrives via tough → reqwest →
    # rustls-platform-verifier.)
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    # monty's unicode_names2 embeds the Unicode character-name tables under
    # the data-files license predecessor of the already-allowed Unicode-3.0
    # (OSI approved); the crate's own code is MIT OR Apache-2.0.
    { crate = "unicode_names2", allow = ["Unicode-DFS-2016"] },
]

[bans]
# Large async trees legitimately carry duplicate versions — warn, don't fail.
multiple-versions = "warn"
# Wildcard ("*") version requirements are forbidden; we pin every external dep.
wildcards = "deny"
# ...except internal `path` deps, which legitimately have no version requirement.
allow-wildcard-paths = true

[sources]
# Only crates.io and explicitly-allowed git sources; anything else fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Operator-approved exception (tkdp-frontend Requirement 8.2): crates.io monty
# 0.0.19 predates in-sandbox dataclasses (pydantic/monty#626), and the tkdp
# parts mechanism additionally needs embedder-registered source modules, which
# no release ships — so the workspace pins the tokeira fork, one patch atop
# the previously pinned upstream revision. Retire the fork entry for upstream
# once pydantic/monty ships a module seam (pydantic/monty#601), and the git
# exception entirely at the first crates.io release carrying both.
allow-git = ["https://github.com/iw/monty"]
