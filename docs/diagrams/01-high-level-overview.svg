<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Inter, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Tokeira Architecture — Three Planes</text>

  <!-- SDK Workers (external) -->
  <rect x="30" y="55" width="120" height="40" rx="6" fill="#e8f4fd" stroke="#4a9eda" stroke-width="1.5"/>
  <text x="90" y="79" text-anchor="middle" font-size="11" fill="#2c6faa">SDK Workers</text>

  <!-- Operators (external) -->
  <rect x="750" y="55" width="120" height="40" rx="6" fill="#e8f4fd" stroke="#4a9eda" stroke-width="1.5"/>
  <text x="810" y="79" text-anchor="middle" font-size="11" fill="#2c6faa">Operators / UI</text>

  <!-- ═══ PLANE 1: Compatibility Edge ═══ -->
  <rect x="20" y="110" width="860" height="100" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="40" y="130" font-size="11" font-weight="bold" fill="#e65100">PLANE 1 — Compatibility Edge</text>

  <rect x="50" y="140" width="130" height="50" rx="5" fill="#fff" stroke="#f57c00"/>
  <text x="115" y="162" text-anchor="middle" font-size="10" fill="#333">tokeira-edge</text>
  <text x="115" y="176" text-anchor="middle" font-size="9" fill="#777">gRPC WorkflowService</text>

  <rect x="210" y="140" width="130" height="50" rx="5" fill="#fff" stroke="#f57c00"/>
  <text x="275" y="162" text-anchor="middle" font-size="10" fill="#333">tokeira-proto</text>
  <text x="275" y="176" text-anchor="middle" font-size="9" fill="#777">Wire types (public)</text>

  <rect x="370" y="140" width="130" height="50" rx="5" fill="#fff" stroke="#f57c00"/>
  <text x="435" y="162" text-anchor="middle" font-size="10" fill="#333">tokeira-types</text>
  <text x="435" y="176" text-anchor="middle" font-size="9" fill="#777">Identifiers, DTOs</text>

  <rect x="540" y="140" width="160" height="50" rx="5" fill="#fff" stroke="#f57c00"/>
  <text x="620" y="162" text-anchor="middle" font-size="10" fill="#333">Interceptors + Router</text>
  <text x="620" y="176" text-anchor="middle" font-size="9" fill="#777">AuthN, Namespace, Routing</text>

  <rect x="730" y="140" width="130" height="50" rx="5" fill="#fff" stroke="#f57c00"/>
  <text x="795" y="162" text-anchor="middle" font-size="10" fill="#333">Long-Poll Gate</text>
  <text x="795" y="176" text-anchor="middle" font-size="9" fill="#777">Admission control</text>

  <!-- ═══ PLANE 2: Authoritative Runtime + Storage ═══ -->
  <rect x="20" y="225" width="860" height="240" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="40" y="245" font-size="11" font-weight="bold" fill="#1b5e20">PLANE 2 — Authoritative Runtime &amp; Storage</text>

  <!-- Kernel -->
  <rect x="50" y="260" width="160" height="70" rx="5" fill="#fff" stroke="#388e3c"/>
  <text x="130" y="285" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">tokeira-kernel</text>
  <text x="130" y="300" text-anchor="middle" font-size="9" fill="#777">Pure state machine</text>
  <text x="130" y="313" text-anchor="middle" font-size="9" fill="#777">Command → Transition</text>

  <!-- Runtime -->
  <rect x="240" y="260" width="280" height="70" rx="5" fill="#fff" stroke="#388e3c"/>
  <text x="380" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">tokeira-runtime</text>
  <text x="290" y="300" text-anchor="middle" font-size="9" fill="#555">Lanes (32)</text>
  <text x="380" y="300" text-anchor="middle" font-size="9" fill="#555">Broker</text>
  <text x="460" y="300" text-anchor="middle" font-size="9" fill="#555">Scanners</text>
  <text x="330" y="315" text-anchor="middle" font-size="9" fill="#555">Shard Owner</text>
  <text x="430" y="315" text-anchor="middle" font-size="9" fill="#555">Pollers</text>

  <!-- Storage -->
  <rect x="550" y="260" width="310" height="70" rx="5" fill="#fff" stroke="#388e3c"/>
  <text x="705" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">tokeira-storage</text>
  <text x="620" y="300" text-anchor="middle" font-size="9" fill="#555">DsqlRunRepository</text>
  <text x="760" y="300" text-anchor="middle" font-size="9" fill="#555">Reservoir</text>
  <text x="620" y="315" text-anchor="middle" font-size="9" fill="#555">MigrationRunner</text>
  <text x="760" y="315" text-anchor="middle" font-size="9" fill="#555">ConnectionDirector</text>

  <!-- DSQL + DynamoDB -->
  <rect x="550" y="350" width="150" height="50" rx="5" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="625" y="372" text-anchor="middle" font-size="10" fill="#1565c0">Aurora DSQL</text>
  <text x="625" y="386" text-anchor="middle" font-size="9" fill="#555">eu-west-2</text>

  <rect x="720" y="350" width="140" height="50" rx="5" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="790" y="372" text-anchor="middle" font-size="10" fill="#1565c0">DynamoDB</text>
  <text x="790" y="386" text-anchor="middle" font-size="9" fill="#555">Rate limiter + Slots</text>

  <!-- Placement -->
  <rect x="50" y="350" width="180" height="50" rx="5" fill="#fff" stroke="#388e3c"/>
  <text x="140" y="372" text-anchor="middle" font-size="10" fill="#333">Placement Controller</text>
  <text x="140" y="386" text-anchor="middle" font-size="9" fill="#777">Shard assignment, membership</text>

  <!-- Dispatch -->
  <rect x="260" y="350" width="260" height="50" rx="5" fill="#fff" stroke="#388e3c"/>
  <text x="390" y="372" text-anchor="middle" font-size="10" fill="#333">Dispatch Backlog (DSQL)</text>
  <text x="390" y="386" text-anchor="middle" font-size="9" fill="#777">Durable fallback for unmatched tasks</text>

  <!-- Timer / Activity state -->
  <rect x="50" y="420" width="470" height="30" rx="5" fill="#f1f8e9" stroke="#7cb342"/>
  <text x="285" y="440" text-anchor="middle" font-size="9" fill="#555">Timer Buckets · Activity State · Request Dedupe · Shard Lease — all in DSQL</text>

  <!-- ═══ PLANE 3: Projection ═══ -->
  <rect x="20" y="480" width="860" height="90" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="40" y="500" font-size="11" font-weight="bold" fill="#4a148c">PLANE 3 — Projection</text>

  <rect x="50" y="510" width="180" height="45" rx="5" fill="#fff" stroke="#7b1fa2"/>
  <text x="140" y="530" text-anchor="middle" font-size="10" fill="#333">tokeira-projection</text>
  <text x="140" y="544" text-anchor="middle" font-size="9" fill="#777">Projection workers</text>

  <rect x="260" y="510" width="150" height="45" rx="5" fill="#fff" stroke="#7b1fa2"/>
  <text x="335" y="530" text-anchor="middle" font-size="10" fill="#333">Visibility Store</text>
  <text x="335" y="544" text-anchor="middle" font-size="9" fill="#777">SQL visibility (DSQL)</text>

  <rect x="440" y="510" width="150" height="45" rx="5" fill="#fff" stroke="#7b1fa2"/>
  <text x="515" y="530" text-anchor="middle" font-size="10" fill="#333">Projection Log</text>
  <text x="515" y="544" text-anchor="middle" font-size="9" fill="#777">Partitioned, replayable</text>

  <rect x="620" y="510" width="130" height="45" rx="5" fill="#fff" stroke="#7b1fa2"/>
  <text x="685" y="530" text-anchor="middle" font-size="10" fill="#333">Rollups</text>
  <text x="685" y="544" text-anchor="middle" font-size="9" fill="#777">vis_rollup shards</text>

  <!-- ═══ Arrows ═══ -->
  <!-- SDK → Edge -->
  <line x1="90" y1="95" x2="90" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Operators → Edge -->
  <line x1="810" y1="95" x2="795" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Edge → Runtime -->
  <line x1="115" y1="190" x2="300" y2="260" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Runtime → Kernel -->
  <line x1="240" y1="295" x2="210" y2="295" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Runtime → Storage -->
  <line x1="520" y1="295" x2="550" y2="295" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Storage → DSQL -->
  <line x1="625" y1="330" x2="625" y2="350" stroke="#1565c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Storage → DynamoDB -->
  <line x1="760" y1="330" x2="790" y2="350" stroke="#1565c0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Runtime → Projection -->
  <line x1="380" y1="330" x2="380" y2="510" stroke="#7b1fa2" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="585" width="860" height="25" rx="4" fill="#f5f5f5"/>
  <text x="40" y="602" font-size="9" fill="#555">Legend:</text>
  <rect x="90" y="593" width="12" height="12" fill="#fff3e0" stroke="#f57c00"/>
  <text x="108" y="603" font-size="9" fill="#555">Edge (translate, gate)</text>
  <rect x="240" y="593" width="12" height="12" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="258" y="603" font-size="9" fill="#555">Runtime + Storage (correctness)</text>
  <rect x="430" y="593" width="12" height="12" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="448" y="603" font-size="9" fill="#555">Projection (read models)</text>
  <rect x="600" y="593" width="12" height="12" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="618" y="603" font-size="9" fill="#555">AWS Services</text>
</svg>
