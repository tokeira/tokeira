<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, -apple-system, sans-serif" font-size="11">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#fafafa" rx="8"/>
  <text x="400" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Lane Commit Pipeline — Per-Command Flow</text>

  <!-- Edge request -->
  <rect x="30" y="50" width="140" height="40" rx="5" fill="#fff3e0" stroke="#f57c00"/>
  <text x="100" y="74" text-anchor="middle" font-size="10" fill="#333">Edge Request</text>

  <!-- Runtime submit -->
  <rect x="30" y="120" width="140" height="40" rx="5" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="100" y="137" text-anchor="middle" font-size="10" fill="#333">runtime.submit()</text>
  <text x="100" y="150" text-anchor="middle" font-size="9" fill="#777">shard ownership check</text>

  <!-- Lane channel -->
  <rect x="220" y="120" width="160" height="40" rx="5" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="300" y="137" text-anchor="middle" font-size="10" fill="#333">Lane Channel (mpsc)</text>
  <text x="300" y="150" text-anchor="middle" font-size="9" fill="#777">bounded, 1024 capacity</text>

  <!-- Queue wait metric -->
  <rect x="220" y="175" width="160" height="25" rx="3" fill="#fff9c4" stroke="#f9a825"/>
  <text x="300" y="192" text-anchor="middle" font-size="9" fill="#795548">⏱ lane_queue_wait_seconds</text>

  <!-- Lane executor -->
  <rect x="200" y="220" width="560" height="220" rx="8" fill="#f1f8e9" stroke="#66bb6a" stroke-dasharray="3,2"/>
  <text x="220" y="240" font-size="10" font-weight="bold" fill="#2e7d32">Lane Executor (single-threaded per lane)</text>

  <!-- load_run -->
  <rect x="230" y="255" width="130" height="40" rx="5" fill="#fff" stroke="#388e3c"/>
  <text x="295" y="272" text-anchor="middle" font-size="10" fill="#333">repo.load_run()</text>
  <text x="295" y="286" text-anchor="middle" font-size="9" fill="#777">~7.5ms avg</text>

  <!-- kernel.apply -->
  <rect x="390" y="255" width="130" height="40" rx="5" fill="#fff" stroke="#388e3c"/>
  <text x="455" y="272" text-anchor="middle" font-size="10" fill="#333">kernel.apply()</text>
  <text x="455" y="286" text-anchor="middle" font-size="9" fill="#777">pure, deterministic</text>

  <!-- commit -->
  <rect x="550" y="255" width="180" height="40" rx="5" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="640" y="272" text-anchor="middle" font-size="10" fill="#1565c0">commit_transition()</text>
  <text x="640" y="286" text-anchor="middle" font-size="9" fill="#555">~44ms avg to DSQL</text>

  <!-- OCC check -->
  <rect x="550" y="310" width="180" height="30" rx="3" fill="#ffebee" stroke="#c62828"/>
  <text x="640" y="330" text-anchor="middle" font-size="9" fill="#c62828">OCC: transition_seq fence</text>

  <!-- Processing duration metric -->
  <rect x="230" y="310" width="290" height="25" rx="3" fill="#fff9c4" stroke="#f9a825"/>
  <text x="375" y="327" text-anchor="middle" font-size="9" fill="#795548">⏱ lane_processing_duration_seconds {command_type}</text>

  <!-- Post-commit -->
  <rect x="230" y="355" width="180" height="40" rx="5" fill="#fff" stroke="#388e3c"/>
  <text x="320" y="372" text-anchor="middle" font-size="10" fill="#333">Publish dispatch ops</text>
  <text x="320" y="386" text-anchor="middle" font-size="9" fill="#777">Broker, backlog, timers</text>

  <!-- Reply -->
  <rect x="440" y="355" width="140" height="40" rx="5" fill="#fff" stroke="#388e3c"/>
  <text x="510" y="372" text-anchor="middle" font-size="10" fill="#333">reply_tx.send()</text>
  <text x="510" y="386" text-anchor="middle" font-size="9" fill="#777">CommitResult to caller</text>

  <!-- Projection log -->
  <rect x="610" y="355" width="130" height="40" rx="5" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="675" y="372" text-anchor="middle" font-size="10" fill="#7b1fa2">Projection log</text>
  <text x="675" y="386" text-anchor="middle" font-size="9" fill="#777">append events</text>

  <!-- Submit duration metric -->
  <rect x="30" y="175" width="160" height="25" rx="3" fill="#fff9c4" stroke="#f9a825"/>
  <text x="110" y="192" text-anchor="middle" font-size="9" fill="#795548">⏱ lane_submit_duration (e2e)</text>

  <!-- Arrows -->
  <line x1="100" y1="90" x2="100" y2="120" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="170" y1="140" x2="220" y2="140" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="300" y1="160" x2="300" y2="220" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="360" y1="275" x2="390" y2="275" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="520" y1="275" x2="550" y2="275" stroke="#1565c0" stroke-width="1" marker-end="url(#arr-blue)"/>
  <line x1="640" y1="295" x2="640" y2="310" stroke="#c62828" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="320" y1="335" x2="320" y2="355" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Timing annotations -->
  <text x="30" y="460" font-size="9" fill="#555">Echo workflow: Start (87ms) → WFT Started (40ms) → WFT Completed (52ms) = 179ms lane processing + 93ms queue wait = 272ms total</text>
</svg>
