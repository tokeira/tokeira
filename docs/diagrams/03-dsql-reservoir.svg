<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, -apple-system, sans-serif" font-size="11">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#fafafa" rx="8"/>
  <text x="400" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">DSQL Connection Reservoir</text>

  <!-- Reservoir boundary -->
  <rect x="30" y="45" width="740" height="340" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-dasharray="4,2"/>
  <text x="50" y="65" font-size="10" font-weight="bold" fill="#0d47a1">DsqlStore — Connection Management</text>

  <!-- Ready channel -->
  <rect x="300" y="80" width="200" height="50" rx="20" fill="#bbdefb" stroke="#1565c0"/>
  <text x="400" y="102" text-anchor="middle" font-size="10" fill="#0d47a1">Ready Channel</text>
  <text x="400" y="116" text-anchor="middle" font-size="9" fill="#555">async_channel (50 capacity)</text>

  <!-- Refiller -->
  <rect x="50" y="160" width="160" height="60" rx="5" fill="#fff" stroke="#1565c0"/>
  <text x="130" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Refiller</text>
  <text x="130" y="195" text-anchor="middle" font-size="9" fill="#555">Creates connections</text>
  <text x="130" y="208" text-anchor="middle" font-size="9" fill="#555">Respects rate + slots</text>

  <!-- Scanner -->
  <rect x="50" y="250" width="160" height="60" rx="5" fill="#fff" stroke="#1565c0"/>
  <text x="130" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Scanner</text>
  <text x="130" y="285" text-anchor="middle" font-size="9" fill="#555">Checks lifetime expiry</text>
  <text x="130" y="298" text-anchor="middle" font-size="9" fill="#555">Retires old connections</text>

  <!-- Return processor -->
  <rect x="560" y="160" width="180" height="60" rx="5" fill="#fff" stroke="#1565c0"/>
  <text x="650" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Return Processor</text>
  <text x="650" y="195" text-anchor="middle" font-size="9" fill="#555">Validates returned conns</text>
  <text x="650" y="208" text-anchor="middle" font-size="9" fill="#555">Lifetime + bad-flag check</text>

  <!-- ConnectionDirector -->
  <rect x="270" y="160" width="240" height="60" rx="5" fill="#c8e6c9" stroke="#388e3c"/>
  <text x="390" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">ConnectionDirector</text>
  <text x="390" y="195" text-anchor="middle" font-size="9" fill="#555">Class permits (commit/read/proj/ctrl)</text>
  <text x="390" y="208" text-anchor="middle" font-size="9" fill="#555">acquire() → PhysicalConn checkout</text>

  <!-- Distributed Token Bucket -->
  <rect x="50" y="340" width="200" height="40" rx="5" fill="#fff8e1" stroke="#f9a825"/>
  <text x="150" y="357" text-anchor="middle" font-size="10" fill="#795548">Distributed Token Bucket</text>
  <text x="150" y="370" text-anchor="middle" font-size="9" fill="#555">DynamoDB — 100/sec cluster-wide</text>

  <!-- Slot Block Manager -->
  <rect x="290" y="340" width="200" height="40" rx="5" fill="#fff8e1" stroke="#f9a825"/>
  <text x="390" y="357" text-anchor="middle" font-size="10" fill="#795548">Slot Block Manager</text>
  <text x="390" y="370" text-anchor="middle" font-size="9" fill="#555">DynamoDB — 10k conn limit</text>

  <!-- DSQL cluster -->
  <rect x="560" y="280" width="180" height="50" rx="5" fill="#e8eaf6" stroke="#3f51b5"/>
  <text x="650" y="302" text-anchor="middle" font-size="10" fill="#283593">Aurora DSQL Cluster</text>
  <text x="650" y="316" text-anchor="middle" font-size="9" fill="#555">IAM auth, 60min conn limit</text>

  <!-- DynamoDB -->
  <rect x="560" y="340" width="180" height="40" rx="5" fill="#fff8e1" stroke="#f9a825"/>
  <text x="650" y="357" text-anchor="middle" font-size="10" fill="#795548">DynamoDB Tables</text>
  <text x="650" y="370" text-anchor="middle" font-size="9" fill="#555">rate-limiter + conn-lease</text>

  <!-- Arrows -->
  <!-- Refiller → Ready -->
  <line x1="210" y1="180" x2="300" y2="110" stroke="#555" stroke-width="1" marker-end="url(#a)"/>
  <!-- Ready → Director -->
  <line x1="400" y1="130" x2="400" y2="160" stroke="#555" stroke-width="1" marker-end="url(#a)"/>
  <!-- Director → Return -->
  <line x1="510" y1="190" x2="560" y2="190" stroke="#555" stroke-width="1" marker-end="url(#a)"/>
  <!-- Return → Ready -->
  <line x1="650" y1="160" x2="500" y2="110" stroke="#555" stroke-width="1" marker-end="url(#a)"/>
  <!-- Refiller → Token Bucket -->
  <line x1="130" y1="220" x2="130" y2="340" stroke="#f9a825" stroke-width="1" marker-end="url(#a)"/>
  <!-- Refiller → Slot Block -->
  <line x1="210" y1="210" x2="290" y2="350" stroke="#f9a825" stroke-width="1" marker-end="url(#a)"/>
  <!-- Director → DSQL -->
  <line x1="510" y1="200" x2="560" y2="290" stroke="#3f51b5" stroke-width="1" marker-end="url(#a)"/>

  <!-- Metrics annotation -->
  <text x="50" y="410" font-size="9" fill="#555">Metrics: reservoir_utilization_ratio · pool_connections_total (50) · slot_blocks_owned · rate_limiter_tokens_remaining · pool_checkout_duration_seconds</text>
</svg>
