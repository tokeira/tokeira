<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, -apple-system, sans-serif" font-size="11">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#fafafa" rx="8"/>
  <text x="400" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Deployment &amp; Tooling Architecture</text>

  <!-- tkr CLI -->
  <rect x="320" y="45" width="160" height="40" rx="5" fill="#e0e0e0" stroke="#616161"/>
  <text x="400" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">tkr CLI</text>

  <!-- Orchestrator -->
  <rect x="280" y="110" width="240" height="40" rx="5" fill="#fff" stroke="#616161"/>
  <text x="400" y="127" text-anchor="middle" font-size="10" fill="#333">tokeira-orchestrator</text>
  <text x="400" y="141" text-anchor="middle" font-size="9" fill="#777">Deployment + InfraEngine + DeployEngine</text>

  <!-- Platforms -->
  <rect x="30" y="180" width="220" height="180" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-dasharray="3,2"/>
  <text x="140" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">Compose Platform</text>

  <rect x="50" y="210" width="180" height="30" rx="4" fill="#fff" stroke="#388e3c"/>
  <text x="140" y="229" text-anchor="middle" font-size="9" fill="#333">tokeira-compose (bollard)</text>

  <rect x="50" y="250" width="180" height="30" rx="4" fill="#fff" stroke="#388e3c"/>
  <text x="140" y="269" text-anchor="middle" font-size="9" fill="#333">platforms/compose/ (config, modules)</text>

  <rect x="50" y="290" width="85" height="25" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="92" y="307" text-anchor="middle" font-size="8" fill="#1565c0">DSQL</text>

  <rect x="145" y="290" width="85" height="25" rx="3" fill="#fff8e1" stroke="#f9a825"/>
  <text x="187" y="307" text-anchor="middle" font-size="8" fill="#795548">DynamoDB</text>

  <rect x="50" y="325" width="180" height="25" rx="3" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="140" y="342" text-anchor="middle" font-size="8" fill="#4a148c">Observability: Mimir · Loki · Grafana · Alloy</text>

  <!-- Local platform -->
  <rect x="290" y="180" width="220" height="100" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-dasharray="3,2"/>
  <text x="400" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">Local Platform</text>

  <rect x="310" y="210" width="180" height="30" rx="4" fill="#fff" stroke="#f57c00"/>
  <text x="400" y="229" text-anchor="middle" font-size="9" fill="#333">platforms/local/ (bare process)</text>

  <rect x="310" y="250" width="180" height="20" rx="3" fill="#fafafa" stroke="#bdbdbd"/>
  <text x="400" y="264" text-anchor="middle" font-size="8" fill="#555">In-memory storage (no DSQL)</text>

  <!-- IaC engine -->
  <rect x="550" y="180" width="220" height="180" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-dasharray="3,2"/>
  <text x="660" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#283593">IaC Engine</text>

  <rect x="570" y="210" width="180" height="30" rx="4" fill="#fff" stroke="#3f51b5"/>
  <text x="660" y="229" text-anchor="middle" font-size="9" fill="#333">tokeira-iac (plan/apply/destroy)</text>

  <rect x="570" y="250" width="180" height="30" rx="4" fill="#fff" stroke="#3f51b5"/>
  <text x="660" y="269" text-anchor="middle" font-size="9" fill="#333">tokeira-aws (DSQL, DDB resources)</text>

  <rect x="570" y="290" width="180" height="30" rx="4" fill="#fff" stroke="#3f51b5"/>
  <text x="660" y="309" text-anchor="middle" font-size="9" fill="#333">tokeira-state (CAS store, S3)</text>

  <rect x="570" y="330" width="180" height="30" rx="4" fill="#fff" stroke="#3f51b5"/>
  <text x="660" y="349" text-anchor="middle" font-size="9" fill="#333">tokeira-deploy-engine (services)</text>

  <!-- Arrows -->
  <line x1="400" y1="85" x2="400" y2="110" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="340" y1="150" x2="140" y2="180" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="400" y1="150" x2="400" y2="180" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="460" y1="150" x2="660" y2="180" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>

  <!-- Legend -->
  <text x="30" y="390" font-size="9" fill="#555">tkr infra apply → IaC Engine → AWS resources | tkr deploy apply → DeployEngine → Platform (compose/local) → containers/processes</text>
</svg>
