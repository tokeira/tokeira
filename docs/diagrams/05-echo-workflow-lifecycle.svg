<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, -apple-system, sans-serif" font-size="11">
  <defs>
    <marker id="aw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#fafafa" rx="8"/>
  <text x="400" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Echo Workflow Lifecycle — 3 Commits</text>

  <!-- Participants -->
  <rect x="50" y="45" width="80" height="30" rx="4" fill="#e8f4fd" stroke="#4a9eda"/>
  <text x="90" y="64" text-anchor="middle" font-size="9" fill="#2c6faa">Client</text>
  <rect x="200" y="45" width="80" height="30" rx="4" fill="#fff3e0" stroke="#f57c00"/>
  <text x="240" y="64" text-anchor="middle" font-size="9" fill="#e65100">Edge</text>
  <rect x="350" y="45" width="80" height="30" rx="4" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="390" y="64" text-anchor="middle" font-size="9" fill="#1b5e20">Runtime</text>
  <rect x="500" y="45" width="80" height="30" rx="4" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="540" y="64" text-anchor="middle" font-size="9" fill="#1b5e20">Kernel</text>
  <rect x="630" y="45" width="80" height="30" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="670" y="64" text-anchor="middle" font-size="9" fill="#0d47a1">DSQL</text>

  <!-- Lifelines -->
  <line x1="90" y1="75" x2="90" y2="480" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="240" y1="75" x2="240" y2="480" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="75" x2="390" y2="480" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="540" y1="75" x2="540" y2="480" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="670" y1="75" x2="670" y2="480" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Worker -->
  <rect x="730" y="45" width="60" height="30" rx="4" fill="#e8f4fd" stroke="#4a9eda"/>
  <text x="760" y="64" text-anchor="middle" font-size="9" fill="#2c6faa">Worker</text>
  <line x1="760" y1="75" x2="760" y2="480" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ═══ COMMIT 1: Start ═══ -->
  <rect x="15" y="90" width="770" height="100" rx="4" fill="#fff9c4" fill-opacity="0.3"/>
  <text x="25" y="103" font-size="9" font-weight="bold" fill="#f57f17">COMMIT 1 — Start (87ms)</text>

  <line x1="90" y1="115" x2="240" y2="115" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="165" y="110" text-anchor="middle" font-size="8" fill="#555">StartWorkflowExecution</text>

  <line x1="240" y1="130" x2="390" y2="130" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="315" y="125" text-anchor="middle" font-size="8" fill="#555">submit(Start)</text>

  <line x1="390" y1="145" x2="540" y2="145" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="465" y="140" text-anchor="middle" font-size="8" fill="#555">apply(Start)</text>

  <line x1="390" y1="160" x2="670" y2="160" stroke="#1565c0" stroke-width="1" marker-end="url(#aw)"/>
  <text x="530" y="155" text-anchor="middle" font-size="8" fill="#1565c0">commit(WfStarted + WftScheduled)</text>

  <line x1="670" y1="175" x2="390" y2="175" stroke="#1565c0" stroke-width="1" marker-end="url(#aw)"/>
  <text x="530" y="172" text-anchor="middle" font-size="8" fill="#1565c0">Applied</text>

  <!-- ═══ COMMIT 2: WFT Started ═══ -->
  <rect x="15" y="200" width="770" height="110" rx="4" fill="#e8f5e9" fill-opacity="0.3"/>
  <text x="25" y="213" font-size="9" font-weight="bold" fill="#2e7d32">COMMIT 2 — WFT Started (40ms)</text>

  <line x1="760" y1="225" x2="240" y2="225" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="500" y="220" text-anchor="middle" font-size="8" fill="#555">PollWorkflowTaskQueue</text>

  <line x1="240" y1="240" x2="390" y2="240" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="315" y="235" text-anchor="middle" font-size="8" fill="#555">submit(WftStarted)</text>

  <line x1="390" y1="255" x2="540" y2="255" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="465" y="250" text-anchor="middle" font-size="8" fill="#555">apply(WftStarted)</text>

  <line x1="390" y1="270" x2="670" y2="270" stroke="#1565c0" stroke-width="1" marker-end="url(#aw)"/>
  <text x="530" y="265" text-anchor="middle" font-size="8" fill="#1565c0">commit(WftStarted event)</text>

  <line x1="670" y1="285" x2="390" y2="285" stroke="#1565c0" stroke-width="1" marker-end="url(#aw)"/>

  <line x1="240" y1="295" x2="760" y2="295" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="500" y="290" text-anchor="middle" font-size="8" fill="#555">WFT + history → worker</text>

  <!-- ═══ COMMIT 3: WFT Completed ═══ -->
  <rect x="15" y="320" width="770" height="130" rx="4" fill="#f3e5f5" fill-opacity="0.3"/>
  <text x="25" y="333" font-size="9" font-weight="bold" fill="#6a1b9a">COMMIT 3 — WFT Completed (52ms)</text>

  <line x1="760" y1="350" x2="240" y2="350" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="500" y="345" text-anchor="middle" font-size="8" fill="#555">RespondWorkflowTaskCompleted [CompleteWorkflow]</text>

  <line x1="240" y1="365" x2="390" y2="365" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="315" y="360" text-anchor="middle" font-size="8" fill="#555">submit(WftCompleted)</text>

  <line x1="390" y1="380" x2="540" y2="380" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="465" y="375" text-anchor="middle" font-size="8" fill="#555">apply(WftCompleted)</text>

  <line x1="390" y1="395" x2="670" y2="395" stroke="#1565c0" stroke-width="1" marker-end="url(#aw)"/>
  <text x="530" y="390" text-anchor="middle" font-size="8" fill="#1565c0">commit(WftCompleted + WfCompleted)</text>

  <line x1="670" y1="410" x2="390" y2="410" stroke="#1565c0" stroke-width="1" marker-end="url(#aw)"/>

  <line x1="240" y1="425" x2="90" y2="425" stroke="#555" stroke-width="1" marker-end="url(#aw)"/>
  <text x="165" y="420" text-anchor="middle" font-size="8" fill="#555">get_result() → completed</text>

  <!-- Projection -->
  <line x1="390" y1="440" x2="390" y2="460" stroke="#7b1fa2" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="390" y="475" text-anchor="middle" font-size="8" fill="#7b1fa2">→ projection log → visibility</text>

  <!-- Timing summary -->
  <text x="400" y="495" text-anchor="middle" font-size="9" fill="#555">Total: 87 + 40 + 52 = 179ms processing + 93ms queue wait = 272ms server-side | Client observes ~960ms (includes SDK polling)</text>
</svg>
