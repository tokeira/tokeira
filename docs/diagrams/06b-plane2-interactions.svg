<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 820" font-family="Inter, -apple-system, sans-serif" font-size="11">
  <defs>
    <marker id="f" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#333"/>
    </marker>
    <marker id="fb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#1565c0"/>
    </marker>
    <marker id="fg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2e7d32"/>
    </marker>
    <marker id="fr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#c62828"/>
    </marker>
    <marker id="fp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6a1b9a"/>
    </marker>
  </defs>

  <rect width="1050" height="820" fill="#fafafa" rx="8"/>
  <text x="525" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Plane 2 — Component Interactions (Annotated)</text>
  <text x="525" y="46" text-anchor="middle" font-size="10" fill="#777">Arrows show data/control flow. Annotations explain WHY each interaction exists.</text>

  <!-- ═══ EXTERNAL INPUTS ═══ -->
  <rect x="30" y="60" width="120" height="30" rx="4" fill="#fff3e0" stroke="#f57c00"/>
  <text x="90" y="79" text-anchor="middle" font-size="9" fill="#e65100">Edge: mutations</text>
  <rect x="180" y="60" width="120" height="30" rx="4" fill="#fff3e0" stroke="#f57c00"/>
  <text x="240" y="79" text-anchor="middle" font-size="9" fill="#e65100">Edge: polls</text>
  <rect x="330" y="60" width="140" height="30" rx="4" fill="#fff3e0" stroke="#f57c00"/>
  <text x="400" y="79" text-anchor="middle" font-size="9" fill="#e65100">Edge: history reads</text>

  <!-- ═══ SHARD OWNER ═══ -->
  <rect x="600" y="60" width="200" height="65" rx="6" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="700" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">ShardOwner</text>
  <text x="610" y="96" font-size="8" fill="#555">Holds: HashMap&lt;ShardId → (epoch, state)&gt;</text>
  <text x="610" y="108" font-size="8" fill="#555">States: Sweeping → Active → Draining</text>
  <text x="610" y="120" font-size="8" fill="#555">32 shards, each at epoch from shard_lease</text>

  <!-- ═══ RUNTIME (submit entry) ═══ -->
  <rect x="30" y="140" width="280" height="70" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="170" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">TokeiraRuntime.submit()</text>
  <text x="40" y="178" font-size="9" fill="#555">1. Check shard ownership (is_active?)</text>
  <text x="40" y="192" font-size="9" fill="#555">2. Route to lane: shard_id % lane_count</text>
  <text x="40" y="206" font-size="9" fill="#555">3. Send LaneMessage to lane's mpsc channel</text>

  <!-- ═══ BROKER ═══ -->
  <rect x="350" y="140" width="260" height="100" rx="6" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="480" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">InMemoryBroker</text>
  <text x="360" y="178" font-size="9" fill="#555">Tier A: sync-match (poller waiting → instant)</text>
  <text x="360" y="192" font-size="9" fill="#555">Tier B: live-ready (in-memory, short grace)</text>
  <text x="360" y="206" font-size="9" fill="#555">Tier C: durable backlog (DSQL fallback)</text>
  <text x="360" y="222" font-size="9" fill="#555">Keyed by: (ns, task_queue, kind, deploy, sticky)</text>
  <text x="360" y="236" font-size="9" fill="#555">try_reserve_poller() → ReservedPoller</text>

  <!-- ═══ LANES ═══ -->
  <rect x="30" y="260" width="580" height="200" rx="6" fill="#f1f8e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="50" y="280" font-size="11" font-weight="bold" fill="#2e7d32">Lane Executor (×32)</text>
  <text x="50" y="296" font-size="9" fill="#555">Per-run serialization by construction: same RunKey → same lane → sequential processing</text>

  <!-- Lane internals -->
  <rect x="50" y="310" width="180" height="50" rx="4" fill="#fff" stroke="#66bb6a"/>
  <text x="140" y="328" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Channel (mpsc, 1024)</text>
  <text x="60" y="345" font-size="8" fill="#555">LaneMessage { run_key, command,</text>
  <text x="60" y="355" font-size="8" fill="#555">  reply_tx, enqueued_at }</text>

  <rect x="250" y="310" width="180" height="50" rx="4" fill="#fff" stroke="#66bb6a"/>
  <text x="340" y="328" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">handle_message()</text>
  <text x="260" y="345" font-size="8" fill="#555">OCC retry loop (max 3)</text>
  <text x="260" y="355" font-size="8" fill="#555">load → apply → commit → reply</text>

  <rect x="450" y="310" width="145" height="50" rx="4" fill="#fff" stroke="#66bb6a"/>
  <text x="522" y="328" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Coalescing</text>
  <text x="460" y="345" font-size="8" fill="#555">Drain N messages for</text>
  <text x="460" y="355" font-size="8" fill="#555">same RunKey before yield</text>

  <!-- Kernel call -->
  <rect x="50" y="375" width="250" height="70" rx="5" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="175" y="395" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">tokeira-kernel (PURE)</text>
  <text x="60" y="413" font-size="9" fill="#555">kernel.apply(LoadedRun, Command)</text>
  <text x="60" y="427" font-size="9" fill="#555">→ Transition { next_state, history_events,</text>
  <text x="60" y="441" font-size="9" fill="#555">   dispatch_ops, timer_ops, projection_ops }</text>

  <!-- Post-commit publish -->
  <rect x="320" y="375" width="280" height="70" rx="5" fill="#c8e6c9" stroke="#388e3c"/>
  <text x="460" y="395" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">Post-Commit Publish</text>
  <text x="330" y="413" font-size="9" fill="#555">dispatch_ops → Publisher → Broker / child lanes</text>
  <text x="330" y="427" font-size="9" fill="#555">timer_ops → timer_bucket inserts</text>
  <text x="330" y="441" font-size="9" fill="#555">projection_ops → projection_log append</text>

  <!-- ═══ SCANNERS ═══ -->
  <rect x="30" y="480" width="580" height="60" rx="5" fill="#c8e6c9" stroke="#388e3c"/>
  <text x="320" y="498" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">Background Scanners (per active shard)</text>
  <text x="40" y="516" font-size="9" fill="#555">Timer: reads timer_bucket → submits TimerDue to lane</text>
  <text x="40" y="530" font-size="9" fill="#555">WFT Timeout: checks in-memory tracking → submits WorkflowTaskTimedOut to lane</text>

  <!-- ═══ STORAGE ═══ -->
  <rect x="650" y="140" width="370" height="400" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="670" y="160" font-size="11" font-weight="bold" fill="#0d47a1">tokeira-storage (DSQL)</text>

  <!-- Director -->
  <rect x="670" y="170" width="330" height="55" rx="5" fill="#bbdefb" stroke="#1565c0"/>
  <text x="835" y="188" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">ConnectionDirector</text>
  <text x="680" y="205" font-size="9" fill="#555">acquire(DbClass) → ConnectionPermit (semaphore-gated)</text>
  <text x="680" y="218" font-size="9" fill="#555">Classes: Commit(23) · Read(10) · Projection(5) · Control(5) · Maint(7)</text>

  <!-- Reservoir -->
  <rect x="670" y="240" width="330" height="45" rx="5" fill="#bbdefb" stroke="#1565c0"/>
  <text x="835" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Reservoir (50 connections)</text>
  <text x="680" y="275" font-size="9" fill="#555">Refiller creates conns (rate-limited) · Scanner retires expired · Return validates</text>

  <!-- RunRepository -->
  <rect x="670" y="300" width="330" height="80" rx="5" fill="#fff" stroke="#1565c0"/>
  <text x="835" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">DsqlRunRepository</text>
  <text x="680" y="335" font-size="9" fill="#555">load_run(RunKey) → LoadedRun [7.5ms avg]</text>
  <text x="680" y="348" font-size="9" fill="#555">commit_transition_for_bundle() [44ms avg]</text>
  <text x="680" y="361" font-size="9" fill="#555">read_history(run_key, after, limit)</text>
  <text x="680" y="374" font-size="9" fill="#555">try_acquire_bundle() / relinquish_bundle()</text>

  <!-- DynamoDB coordination -->
  <rect x="670" y="395" width="160" height="40" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="750" y="412" text-anchor="middle" font-size="9" fill="#795548">Token Bucket (DDB)</text>
  <text x="750" y="425" text-anchor="middle" font-size="8" fill="#555">100 conn/sec cluster</text>

  <rect x="840" y="395" width="160" height="40" rx="4" fill="#fff8e1" stroke="#f9a825"/>
  <text x="920" y="412" text-anchor="middle" font-size="9" fill="#795548">Slot Blocks (DDB)</text>
  <text x="920" y="425" text-anchor="middle" font-size="8" fill="#555">10k conn limit</text>

  <!-- DSQL tables -->
  <rect x="670" y="450" width="330" height="75" rx="5" fill="#e8eaf6" stroke="#3f51b5"/>
  <text x="835" y="468" text-anchor="middle" font-size="10" font-weight="bold" fill="#283593">Aurora DSQL Tables</text>
  <text x="680" y="485" font-size="8" fill="#555">workflow_hot · history_batch · current_execution</text>
  <text x="680" y="498" font-size="8" fill="#555">shard_lease · timer_bucket · activity_state</text>
  <text x="680" y="511" font-size="8" fill="#555">request_dedupe · projection_log · dispatch_backlog</text>
  <text x="680" y="524" font-size="8" fill="#555">vis_execution · vis_rollup · sa_* indexes</text>

  <!-- ═══ PROJECTION OUTPUT ═══ -->
  <rect x="30" y="560" width="250" height="35" rx="5" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="155" y="582" text-anchor="middle" font-size="10" fill="#6a1b9a">→ Projection Workers (Plane 3)</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- ANNOTATED INTERACTION ARROWS -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- 1. Edge mutation → Runtime.submit -->
  <path d="M 90 90 L 90 140" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#f)"/>
  <text x="100" y="118" font-size="8" fill="#333" font-weight="bold">①</text>

  <!-- 2. Edge poll → Broker -->
  <path d="M 240 90 L 400 140" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#f)"/>
  <text x="310" y="108" font-size="8" fill="#333" font-weight="bold">②</text>

  <!-- 3. Runtime.submit checks ShardOwner -->
  <path d="M 310 165 L 600 90" fill="none" stroke="#c62828" stroke-width="1.2" marker-end="url(#fr)"/>
  <text x="440" y="118" font-size="8" fill="#c62828" font-weight="bold">③ ownership gate</text>

  <!-- 4. Runtime.submit → Lane channel -->
  <path d="M 170 210 L 140 310" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#f)"/>
  <text x="130" y="258" font-size="8" fill="#333" font-weight="bold">④ route to lane</text>

  <!-- 5. Lane → Kernel -->
  <path d="M 250 360 L 175 375" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#fg)"/>
  <text x="195" y="365" font-size="8" fill="#2e7d32" font-weight="bold">⑤ pure apply</text>

  <!-- 6. Lane → Storage (load_run) -->
  <path d="M 430 340 L 670 330" fill="none" stroke="#1565c0" stroke-width="1.5" marker-end="url(#fb)"/>
  <text x="530" y="328" font-size="8" fill="#1565c0" font-weight="bold">⑥ load_run (7.5ms)</text>

  <!-- 7. Lane → Storage (commit) -->
  <path d="M 430 355 L 670 350" fill="none" stroke="#1565c0" stroke-width="1.5" marker-end="url(#fb)"/>
  <text x="530" y="352" font-size="8" fill="#1565c0" font-weight="bold">⑦ commit (44ms)</text>

  <!-- 8. Post-commit → Broker (publish WFT) -->
  <path d="M 460 375 L 480 240" fill="none" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#fg)"/>
  <text x="490" y="310" font-size="8" fill="#2e7d32" font-weight="bold">⑧ publish task</text>

  <!-- 9. Broker → Lane (WFT Started via poll match) -->
  <path d="M 350 230 L 170 260" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#f)"/>
  <text x="230" y="240" font-size="8" fill="#333" font-weight="bold">⑨ matched → start WFT</text>

  <!-- 10. Scanner → Lane -->
  <path d="M 320 480 L 320 460" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#f)"/>
  <text x="330" y="472" font-size="8" fill="#333" font-weight="bold">⑩ due timer/timeout</text>

  <!-- 11. Scanner → Storage (timer reads) -->
  <path d="M 610 510 L 670 490" fill="none" stroke="#1565c0" stroke-width="1" marker-end="url(#fb)"/>
  <text x="620" y="498" font-size="8" fill="#1565c0">⑪ scan timer_bucket</text>

  <!-- 12. Post-commit → Projection -->
  <path d="M 320 445 L 155 560" fill="none" stroke="#6a1b9a" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#fp)"/>
  <text x="210" y="510" font-size="8" fill="#6a1b9a" font-weight="bold">⑫ projection_ops</text>

  <!-- 13. Edge history → Storage direct -->
  <path d="M 400 90 L 670 340" fill="none" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#fb)"/>
  <text x="530" y="210" font-size="8" fill="#1565c0">⑬ read_history (bypasses lanes)</text>

  <!-- 14. Membership → ShardOwner -->
  <rect x="830" y="60" width="180" height="40" rx="4" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="920" y="78" text-anchor="middle" font-size="9" fill="#1b5e20">Membership Client</text>
  <text x="920" y="92" text-anchor="middle" font-size="8" fill="#555">heartbeat → controller</text>
  <path d="M 830 80 L 800 80" fill="none" stroke="#333" stroke-width="1" marker-end="url(#f)"/>
  <text x="808" y="74" font-size="8" fill="#333">⑭</text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="20" y="610" width="1010" height="200" rx="6" fill="#f5f5f5" stroke="#e0e0e0"/>
  <text x="40" y="630" font-size="11" font-weight="bold" fill="#333">Interaction Legend</text>

  <text x="40" y="652" font-size="9" fill="#333" font-weight="bold">① Edge mutation → Runtime.submit()</text>
  <text x="350" y="652" font-size="9" fill="#555">StartWorkflow, Signal, RespondWFTCompleted enter here</text>

  <text x="40" y="668" font-size="9" fill="#333" font-weight="bold">② Edge poll → Broker</text>
  <text x="350" y="668" font-size="9" fill="#555">PollWorkflowTaskQueue registers a waiter; broker matches or long-polls</text>

  <text x="40" y="684" font-size="9" fill="#c62828" font-weight="bold">③ Ownership gate</text>
  <text x="350" y="684" font-size="9" fill="#555">Runtime rejects commands for shards not in Active state (NotShardOwner)</text>

  <text x="40" y="700" font-size="9" fill="#333" font-weight="bold">④ Route to lane</text>
  <text x="350" y="700" font-size="9" fill="#555">shard_id % lane_count → deterministic lane. Per-run serialization guaranteed.</text>

  <text x="40" y="716" font-size="9" fill="#2e7d32" font-weight="bold">⑤ Kernel apply (pure)</text>
  <text x="350" y="716" font-size="9" fill="#555">No I/O. Takes LoadedRun + Command, returns Transition with events + ops.</text>

  <text x="40" y="732" font-size="9" fill="#1565c0" font-weight="bold">⑥⑦ Storage (load + commit)</text>
  <text x="350" y="732" font-size="9" fill="#555">load_run reads workflow_hot. commit writes hot + history_batch + side tables atomically.</text>

  <text x="40" y="748" font-size="9" fill="#2e7d32" font-weight="bold">⑧ Publish dispatch ops</text>
  <text x="350" y="748" font-size="9" fill="#555">EnqueueWorkflowTask → broker. StartChild → lane.submit. ScheduleNexus → HTTP.</text>

  <text x="40" y="764" font-size="9" fill="#333" font-weight="bold">⑨ Broker → Lane (WFT start)</text>
  <text x="350" y="764" font-size="9" fill="#555">Matched poller triggers WorkflowTaskStarted commit via runtime.start_polled_workflow_task()</text>

  <text x="40" y="780" font-size="9" fill="#333" font-weight="bold">⑩⑪ Scanners</text>
  <text x="350" y="780" font-size="9" fill="#555">Timer scanner reads DSQL timer_bucket, submits TimerDue to lane. WFT timeout is in-memory only.</text>

  <text x="40" y="796" font-size="9" fill="#6a1b9a" font-weight="bold">⑫ Projection</text>
  <text x="350" y="796" font-size="9" fill="#555">Committed transitions append to projection_log. Workers (Plane 3) consume asynchronously.</text>
</svg>
