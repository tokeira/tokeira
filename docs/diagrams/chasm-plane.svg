<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1360" viewBox="0 0 2000 1360" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="ch_clay" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#B85C38"/></marker>
    <marker id="ch_slate" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#8A8378"/></marker>
    <marker id="ch_blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#33586E"/></marker>
    <style>
      .title { font: 700 34px 'Avenir Next',Avenir,'Segoe UI',sans-serif; fill:#1B1714; }
      .subtitle { font: 500 18px 'Avenir Next',Avenir,sans-serif; fill:#5C564E; }
      .section { font: 700 14px 'SF Mono',Menlo,monospace; fill:#9A4A2C; letter-spacing:2px; }
      .boxtitle { font: 700 19px 'Avenir Next',Avenir,sans-serif; fill:#1B1714; }
      .body { font: 500 14.5px 'Avenir Next',Avenir,sans-serif; fill:#5C564E; }
      .small { font: 500 13px 'Avenir Next',Avenir,sans-serif; fill:#5C564E; }
      .mono { font: 600 12.5px 'SF Mono',Menlo,monospace; fill:#4A443C; }
      .num { font: 800 13px 'Avenir Next',Avenir,sans-serif; fill:#FFFFFF; }
    </style>
  </defs>
  <rect width="2000" height="1360" rx="14" fill="#F6F3EE"/>

  <text x="60" y="48" font-family="'SF Mono',Menlo,monospace" font-size="13" letter-spacing="3" fill="#9A4A2C">TOKEIRA · ARCHITECTURE</text>
  <text x="60" y="88" class="title">The CHASM plane</text>
  <text x="60" y="118" class="subtitle">Durable state-machine components beside the workflow runtime — today, standalone activities. Additive by construction: the same storage discipline, zero shared code paths.</text>

  <text x="60" y="168" class="section">THE FRAMEWORK</text>
  <text x="760" y="168" class="section">THE RUNTIME SUBSTRATE</text>
  <text x="1500" y="168" class="section">EDGE + STORAGE</text>

  <!-- framework -->
  <rect x="60" y="188" width="420" height="150" rx="10" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".18" stroke-width="1.4"/>
  <text x="84" y="220" class="boxtitle">tokeira-chasm</text>
  <text x="84" y="246" class="mono">+ tokeira-chasm-derive · tokeira-chasm-activity</text>
  <text x="84" y="274" class="small">Typed durable components: state, commands, transitions,</text>
  <text x="84" y="294" class="small">timers — authored as Rust types, wired by the derive</text>
  <text x="84" y="314" class="small">macro. Standalone activities are the first component.</text>

  <!-- the boundary card -->
  <rect x="60" y="378" width="420" height="196" rx="10" fill="#F6EDE5" stroke="#B85C38" stroke-opacity=".45" stroke-width="1.4"/>
  <text x="84" y="410" class="boxtitle">The v0.1 boundary — stated plainly</text>
  <text x="84" y="438" class="small">Temporal v1.31.0 ships five CHASM components: activity,</text>
  <text x="84" y="458" class="small">callback, nexusoperation, scheduler, workflow. Tokeira</text>
  <text x="84" y="478" class="small">supports standalone activities only. Upstream itself gates</text>
  <text x="84" y="498" class="small">the scheduler behind an experiment flag and callbacks</text>
  <text x="84" y="518" class="small">behind a mode — the boundary is honest on both sides.</text>
  <text x="84" y="548" class="mono">claim source: docs/readiness/corpus-evidence.md</text>

  <!-- ghosted workflow runtime + boundary -->
  <rect x="60" y="626" width="420" height="104" rx="10" fill="#F6F3EE" stroke="#8A8378" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 5"/>
  <text x="84" y="658" class="boxtitle" fill="#6E6860">The workflow runtime</text>
  <text x="84" y="686" class="small">Its own diagrams. Shared with CHASM: storage discipline</text>
  <text x="84" y="706" class="small">and the visibility index. Not shared: any code path.</text>

  <!-- substrate -->
  <rect x="580" y="188" width="420" height="170" rx="10" fill="#FFFFFF" stroke="#B85C38" stroke-opacity=".5" stroke-width="1.6"/>
  <text x="604" y="220" class="boxtitle">ChasmEngine · TypedEngine</text>
  <text x="604" y="248" class="small">Loads a component tree, applies a typed command,</text>
  <text x="604" y="268" class="small">commits the transition fenced — the same commit</text>
  <text x="604" y="288" class="small">posture as workflows, on separate machinery.</text>
  <text x="604" y="316" class="mono">ChasmNodeRepository — CAS on the node tree</text>

  <rect x="580" y="398" width="420" height="130" rx="10" fill="#F6F3EE" stroke="#8A8378" stroke-opacity=".55" stroke-width="1.3" stroke-dasharray="5 5"/>
  <text x="604" y="430" class="boxtitle" fill="#4A443C">ChasmTimerSweeper</text>
  <text x="604" y="458" class="small">Nothing else fires armed activity timeouts. Gated by</text>
  <text x="604" y="478" class="small">activity.enableStandalone — production pays no idle</text>
  <text x="604" y="498" class="small">sweep; the conformance harness keeps it armed.</text>

  <rect x="580" y="568" width="420" height="150" rx="10" fill="#F6F3EE" stroke="#8A8378" stroke-opacity=".55" stroke-width="1.3" stroke-dasharray="5 5"/>
  <text x="604" y="600" class="boxtitle" fill="#4A443C">Visibility, archetype-neutral</text>
  <text x="604" y="628" class="small">ProjectionVisibilitySink emits one full snapshot per</text>
  <text x="604" y="648" class="small">committed transition, tagged by ArchetypeId — the same</text>
  <text x="604" y="668" class="small">index workflows use. VisibilityRepairScanner heals</text>
  <text x="604" y="688" class="small">missed rows from committed state.</text>

  <!-- edge + storage -->
  <rect x="1500" y="188" width="440" height="196" rx="10" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".18" stroke-width="1.4"/>
  <text x="1524" y="220" class="boxtitle">Edge — ActivityBridge</text>
  <text x="1524" y="248" class="mono">Start · Describe · Poll · Cancel · Terminate ·</text>
  <text x="1524" y="268" class="mono">Delete · List · Count — ActivityExecution</text>
  <text x="1524" y="296" class="small">The standalone-activity surface of WorkflowService.</text>
  <text x="1524" y="316" class="small">Off by default — v1.31.0 answers UNIMPLEMENTED here.</text>
  <text x="1524" y="336" class="small">Opting in is a deliberate step ahead of the baseline:</text>
  <text x="1524" y="358" class="mono">[compatibility] enable_standalone_activities = true</text>

  <rect x="1500" y="438" width="440" height="168" rx="10" fill="#F6F3EE" stroke="#C88D6F" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="1524" y="470" class="boxtitle">Two tables, one index</text>
  <text x="1524" y="498" class="mono">chasm_node · chasm_current_run</text>
  <text x="1524" y="526" class="small">Component trees and current-run pointers, committed</text>
  <text x="1524" y="546" class="small">fenced like everything else. Visibility rows land in the</text>
  <text x="1524" y="566" class="small">shared execution_visibility_* index beside workflows.</text>

  <!-- flows -->
  <g stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1500 260 C1300 260 1180 250 1004 250" stroke="#B85C38" marker-end="url(#ch_clay)"/>
    <path d="M1000 290 C1240 320 1360 420 1496 480" stroke="#B85C38" marker-end="url(#ch_clay)"/>
    <path d="M790 398 V362" stroke="#8A8378" stroke-dasharray="4 5" marker-end="url(#ch_slate)"/>
    <path d="M1000 630 C1240 630 1380 570 1496 540" stroke="#33586E" stroke-dasharray="9 7" marker-end="url(#ch_blue)"/>
    <path d="M480 262 C520 262 540 250 576 244" stroke="#B85C38" opacity=".7" marker-end="url(#ch_clay)"/>
  </g>
  <g>
    <circle cx="1240" cy="256" r="16" fill="#B85C38" stroke="#fff" stroke-width="4"/><text x="1240" y="262" text-anchor="middle" class="num">1</text>
    <circle cx="1250" cy="360" r="16" fill="#B85C38" stroke="#fff" stroke-width="4"/><text x="1250" y="366" text-anchor="middle" class="num">2</text>
    <circle cx="790" cy="382" r="16" fill="#8A8378" stroke="#fff" stroke-width="4"/><text x="790" y="388" text-anchor="middle" class="num">3</text>
    <circle cx="1250" cy="622" r="16" fill="#33586E" stroke="#fff" stroke-width="4"/><text x="1250" y="628" text-anchor="middle" class="num">4</text>
  </g>

  <!-- annotations -->
  <rect x="60" y="800" width="1880" height="420" rx="10" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".14" stroke-width="1.3"/>
  <text x="88" y="836" class="boxtitle">Flow annotations</text>
  <g class="small">
    <circle cx="96" cy="868" r="13" fill="#B85C38"/><text x="96" y="873" text-anchor="middle" class="num">1</text>
    <text x="120" y="873">The ActivityBridge translates the standalone-activity RPCs into typed commands for the ChasmEngine — the edge owns no semantics here either.</text>
    <circle cx="96" cy="904" r="13" fill="#B85C38"/><text x="96" y="909" text-anchor="middle" class="num">2</text>
    <text x="120" y="909">Every transition commits fenced into the component tree (CAS on chasm_node) — the CHASM plane inherits the engine's one non-negotiable habit.</text>
    <circle cx="96" cy="940" r="13" fill="#8A8378"/><text x="96" y="945" text-anchor="middle" class="num">3</text>
    <text x="120" y="945">The sweeper is the only thing that fires armed activity timeouts; it submits typed commands back through the engine, never touching state directly.</text>
    <circle cx="96" cy="976" r="13" fill="#33586E"/><text x="96" y="981" text-anchor="middle" class="num">4</text>
    <text x="120" y="981">Visibility snapshots land in the shared archetype-neutral index — one list surface serves workflows and standalone activities alike.</text>
    <text x="120" y="1022" class="mono">Key: clay = the commit path · dashed grey = sweeper / gated machinery · dashed slate-blue = derived visibility</text>
    <text x="120" y="1062" class="body">Why this plane exists: components that need durability without workflow semantics — no event history replay, no task queues,</text>
    <text x="120" y="1086" class="body">no worker round-trips. A standalone activity is state + retry policy + heartbeats, committed fenced, visible beside everything else.</text>
    <text x="120" y="1126" class="small">What arrives here next tracks upstream: as Temporal's CHASM components mature past their gates, this plane is where they land —</text>
    <text x="120" y="1146" class="small">the substrate is archetype-neutral by construction, and the visibility contract already speaks for components that do not exist yet.</text>
  </g>

  <g transform="translate(1908,1292)" stroke="#B85C38" stroke-width="2.2" stroke-linecap="round" opacity=".8">
    <path d="M0 36 C3 22 6 11 12 0" fill="none"/>
    <g transform="translate(12,0)"><path d="M0 0 L12 -9 M0 0 L15 -1 M0 0 L12 7 M0 0 L4 -13 M0 0 L-5 -12" fill="none"/><circle cx="0" cy="0" r="2.4" fill="#B85C38" stroke="none"/></g>
  </g>
</svg>
