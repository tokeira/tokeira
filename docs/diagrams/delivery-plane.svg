<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1440" viewBox="0 0 1960 1440" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="dp_clay" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1.5,1.5 L7,4.5 L1.5,7.5 Z" fill="#B85C38"/></marker>
    <marker id="dp_teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1.5,1.5 L7,4.5 L1.5,7.5 Z" fill="#0B7285"/></marker>
    <marker id="dp_slate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1.5,1.5 L7,4.5 L1.5,7.5 Z" fill="#8A8378"/></marker>
    <style>
      .title { font: 700 32px 'Avenir Next',Avenir,'Segoe UI',sans-serif; fill:#1B1714; }
      .subtitle { font: 500 17px 'Avenir Next',Avenir,sans-serif; fill:#5C564E; }
      .section { font: 700 13.5px 'SF Mono',Menlo,monospace; fill:#9A4A2C; letter-spacing:2px; }
      .boxtitle { font: 700 18px 'Avenir Next',Avenir,sans-serif; fill:#1B1714; }
      .small { font: 500 13px 'Avenir Next',Avenir,sans-serif; fill:#5C564E; }
      .mono { font: 600 12px 'SF Mono',Menlo,monospace; fill:#4A443C; }
      .tier { font: 700 13px 'SF Mono',Menlo,monospace; fill:#9A4A2C; letter-spacing:1px; }
    </style>
  </defs>
  <rect width="1960" height="1440" rx="14" fill="#F6F3EE"/>

  <text x="56" y="46" font-family="'SF Mono',Menlo,monospace" font-size="12" letter-spacing="3" fill="#9A4A2C">TOKEIRA · ARCHITECTURE</text>
  <text x="56" y="84" class="title">The delivery plane</text>
  <text x="56" y="112" class="subtitle">Ephemeral-first: matching lives in memory, the durable backlog is a fallback, and every queue is disposable — because history can rebuild them all.</text>

  <!-- source -->
  <text x="56" y="164" class="section">THE SOURCE</text>
  <rect x="56" y="184" width="460" height="180" rx="10" fill="#F6EDE5" stroke="#B85C38" stroke-opacity=".5" stroke-width="1.6"/>
  <text x="80" y="216" class="boxtitle">Post-commit dispatch</text>
  <text x="80" y="244" class="small">dispatch_ops publish only after the fenced commit,</text>
  <text x="80" y="264" class="small">and the publish is allowed to fail — sweepers</text>
  <text x="80" y="284" class="small">reconstruct dispatchable work from committed state.</text>
  <text x="80" y="312" class="small">Nothing here is ever the record of what exists.</text>
  <text x="80" y="340" class="mono">a queue write is never load-bearing</text>

  <!-- workers right -->
  <text x="1560" y="164" class="section">WORKERS</text>
  <rect x="1560" y="184" width="344" height="180" rx="10" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".18" stroke-width="1.4"/>
  <text x="1584" y="216" class="boxtitle">Long-pollers</text>
  <text x="1584" y="244" class="small">Parked per queue on a Notify,</text>
  <text x="1584" y="264" class="small">TOCTOU-safe, deadline-bounded.</text>
  <text x="1584" y="292" class="small">A parked sticky poller counts as</text>
  <text x="1584" y="312" class="small">demand on its normal queue too.</text>

  <!-- broker anatomy -->
  <text x="56" y="420" class="section">THE BROKERS — THREE, ONE ANATOMY</text>
  <rect x="56" y="440" width="1848" height="420" rx="12" fill="#FFFFFF" stroke="#0B7285" stroke-opacity=".5" stroke-width="1.6"/>
  <text x="84" y="474" class="boxtitle">InMemoryBroker (workflow tasks) · InMemoryActivityBroker · NexusTaskBroker <tspan font-size="13" fill="#6E6860">(→ its own diagram)</tspan></text>

  <rect x="84" y="496" width="560" height="120" rx="9" fill="#F6F3EE" stroke="#1B1714" stroke-opacity=".14"/>
  <text x="104" y="524" class="boxtitle" font-size="15">The key</text>
  <text x="104" y="550" class="mono">namespace / task queue / kind / deployment / build_id</text>
  <text x="104" y="576" class="small">Versioning is in the key itself; unversioned backlog is</text>
  <text x="104" y="594" class="small">promoted or absorbed when deployments change.</text>

  <rect x="676" y="496" width="560" height="120" rx="9" fill="#F6F3EE" stroke="#1B1714" stroke-opacity=".14"/>
  <text x="696" y="524" class="boxtitle" font-size="15">Sticky beside general</text>
  <text x="696" y="550" class="small">Two ready maps per queue, not a key dimension. Sticky</text>
  <text x="696" y="570" class="small">delivery falls back to the normal queue when the sticky</text>
  <text x="696" y="590" class="small">worker hasn't polled within its 10s availability window.</text>

  <rect x="1268" y="496" width="608" height="120" rx="9" fill="#F6F3EE" stroke="#1B1714" stroke-opacity=".14"/>
  <text x="1288" y="524" class="boxtitle" font-size="15">Dedupe at the door</text>
  <text x="1288" y="550" class="mono">WFTs: (run_key, logical_task_seq)</text>
  <text x="1288" y="574" class="mono">activities: (run_key, activity_id, attempt)</text>
  <text x="1288" y="598" class="small">Republishing after recovery cannot double-deliver.</text>

  <rect x="84" y="648" width="560" height="180" rx="9" fill="#EFF4F5" stroke="#0B7285" stroke-opacity=".45"/>
  <text x="104" y="676" class="tier">TIER A · SYNC-MATCH</text>
  <text x="104" y="704" class="small">The eager-start path only: a poller is reserved before</text>
  <text x="104" y="724" class="small">the commit, and the first workflow task is hand-delivered</text>
  <text x="104" y="744" class="small">— no queue is ever touched.</text>
  <text x="104" y="772" class="mono">try_reserve_poller → deliver → return on failure</text>
  <text x="104" y="800" class="small" fill="#8A8378">everything else enqueues; sync-match is the exception</text>

  <rect x="676" y="648" width="560" height="180" rx="9" fill="#EFF4F5" stroke="#0B7285" stroke-opacity=".45"/>
  <text x="696" y="676" class="tier">TIER B · LIVE-READY</text>
  <text x="696" y="704" class="small">In-memory ordered queues, notified waiters, priority</text>
  <text x="696" y="724" class="small">bands and fairness ordering, dispatch rate limits,</text>
  <text x="696" y="744" class="small">denied-worker filtering.</text>
  <text x="696" y="772" class="small">Demand observations feed the worker-compute</text>
  <text x="696" y="792" class="small">controller from inside the broker.</text>

  <rect x="1268" y="648" width="608" height="180" rx="9" fill="#F7F0DC" stroke="#B08D2E" stroke-opacity=".5"/>
  <text x="1288" y="676" class="tier" fill="#8A5A10">TIER C · DURABLE BACKLOG — OUTSIDE THE BROKER</text>
  <text x="1288" y="704" class="small">The broker holds no storage handle. backlog.rs demotes</text>
  <text x="1288" y="724" class="small">tasks unclaimed past a 5s grace window into dispatch_backlog,</text>
  <text x="1288" y="744" class="small">and rehydrates demand-driven — only queues with parked</text>
  <text x="1288" y="764" class="small">pollers, 100 tasks a drain.</text>
  <text x="1288" y="792" class="mono">grace scanner demotes · drain loop rehydrates</text>

  <!-- flows -->
  <g stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M516 274 C700 274 800 380 980 434" stroke="#B85C38" marker-end="url(#dp_clay)"/>
    <path d="M1560 274 C1400 300 1300 380 1180 436" stroke="#0B7285" marker-end="url(#dp_teal)" stroke-dasharray="7 5"/>
          </g>
  <text x="820" y="356" class="mono" fill="#9A4A2C">publish (non-fatal)</text>
  <text x="1310" y="330" class="mono" fill="#096A7C">long-poll / deliver</text>
  
  <!-- the disposability thesis -->
  <rect x="56" y="912" width="1848" height="130" rx="12" fill="#F6EDE5" stroke="#B85C38" stroke-opacity=".55" stroke-width="1.7"/>
  <text x="80" y="944" class="boxtitle">Why every queue is disposable</text>
  <text x="80" y="972" class="small">Kill the process and every in-memory queue vanishes — and nothing is lost. The sweepers and the shard sweep rebuild dispatchable work from</text>
  <text x="80" y="992" class="small">committed history; the backlog covers the gap for work already demoted; dedupe keys make the rebuild collision-free. Delivery is a performance</text>
  <text x="80" y="1012" class="small">layer over the log, never a second source of truth.</text>

  <!-- footer -->
  <rect x="56" y="1084" width="1848" height="56" rx="12" fill="#FBF9F5" stroke="#8A8378" stroke-opacity=".5" stroke-dasharray="5 5"/>
  <text x="80" y="1108" class="boxtitle" font-size="14" fill="#4A443C">Prose companion:</text>
  <text x="290" y="1108" class="small">docs/architecture/040-delivery-broker.md — this diagram is its picture; the runtime diagrams show where the brokers sit.</text>

  <text x="56" y="1200" class="small" fill="#8A8378">Key: clay = post-commit publish · teal = poll and delivery · gold = the durable fallback.</text>

  <g transform="translate(1868,1368)" stroke="#B85C38" stroke-width="2.2" stroke-linecap="round" opacity=".8">
    <path d="M0 36 C3 22 6 11 12 0" fill="none"/>
    <g transform="translate(12,0)"><path d="M0 0 L12 -9 M0 0 L15 -1 M0 0 L12 7 M0 0 L4 -13 M0 0 L-5 -12" fill="none"/><circle cx="0" cy="0" r="2.4" fill="#B85C38" stroke="none"/></g>
  </g>
</svg>
