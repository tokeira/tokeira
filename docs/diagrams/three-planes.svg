<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" font-family="'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L6,4 L1,7 Z" fill="#B85C38"/>
    </marker>
    <marker id="arrq" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L6,4 L1,7 Z" fill="#8A8378"/>
    </marker>
  </defs>
  <rect width="960" height="920" rx="14" fill="#F6F3EE"/>

  <!-- header lockup -->
  <text x="52" y="52" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#9A4A2C">TOKEIRA · ARCHITECTURE</text>
  <text x="52" y="84" font-size="26" font-weight="700" fill="#1B1714">The three planes</text>
  <line x1="52" y1="102" x2="908" y2="102" stroke="#1B1714" stroke-opacity=".14" stroke-width="1"/>

  <!-- clients -->
  <g>
    <rect x="256" y="122" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".18" stroke-width="1.3"/>
    <text x="356" y="147" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B1714">SDK workers</text>
    <rect x="504" y="122" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".18" stroke-width="1.3"/>
    <text x="604" y="147" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B1714">Operators · UI · CLI</text>
    <path d="M400 162 V190" stroke="#B85C38" stroke-width="2.2" fill="none" marker-end="url(#arr)" stroke-linecap="round"/>
    <path d="M560 162 V190" stroke="#B85C38" stroke-width="2.2" fill="none" marker-end="url(#arr)" stroke-linecap="round"/>
    <text x="480" y="182" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#9A4A2C">temporal gRPC</text>
  </g>

  <!-- PLANE 1 -->
  <g>
    <rect x="52" y="198" width="856" height="128" rx="10" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".18" stroke-width="1.3"/>
    <text x="76" y="228" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="1.8" fill="#9A4A2C">PLANE 1 · COMPATIBILITY EDGE</text>
    <text x="76" y="252" font-size="15" font-weight="700" fill="#1B1714">tokeira-edge</text>
    <text x="76" y="272" font-size="12" fill="#5C564E">Admits and translates. Owns no workflow semantics.</text>
    <rect x="366" y="238" width="164" height="52" rx="7" fill="#F6F3EE" stroke="#1B1714" stroke-opacity=".16"/>
    <text x="448" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1714">Interceptors + router</text>
    <text x="448" y="278" text-anchor="middle" font-size="10.5" fill="#5C564E">authn · namespace · routing</text>
    <rect x="548" y="238" width="150" height="52" rx="7" fill="#F6F3EE" stroke="#1B1714" stroke-opacity=".16"/>
    <text x="623" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1714">Long-poll gate</text>
    <text x="623" y="278" text-anchor="middle" font-size="10.5" fill="#5C564E">admission control</text>
    <text x="732" y="255" font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="#5C564E">tokeira-proto · wire</text>
    <text x="732" y="273" font-family="'SF Mono',Menlo,monospace" font-size="10.5" fill="#5C564E">tokeira-types · identity</text>
  </g>

  <path d="M480 326 V354" stroke="#B85C38" stroke-width="2.4" fill="none" marker-end="url(#arr)" stroke-linecap="round"/>
  <text x="497" y="346" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#9A4A2C">the commit path</text>

  <!-- PLANE 2 -->
  <g>
    <rect x="52" y="362" width="856" height="330" rx="10" fill="#FFFFFF" stroke="#B85C38" stroke-opacity=".5" stroke-width="1.6"/>
    <text x="76" y="392" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="1.8" fill="#9A4A2C">PLANE 2 · AUTHORITATIVE RUNTIME &amp; STORAGE</text>

    <!-- runtime column -->
    <rect x="76" y="410" width="380" height="184" rx="8" fill="#F6F3EE" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="96" y="436" font-size="14" font-weight="700" fill="#1B1714">tokeira-runtime</text>
    <text x="96" y="456" font-size="11.5" fill="#5C564E">one run → one lane → in order</text>
    <rect x="96" y="468" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="171" y="487" text-anchor="middle" font-size="11.5" fill="#1B1714">lanes ×N</text>
    <rect x="258" y="468" width="84" height="30" rx="6" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="300" y="487" text-anchor="middle" font-size="11.5" fill="#1B1714">broker</text>
    <rect x="354" y="468" width="84" height="30" rx="6" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="396" y="487" text-anchor="middle" font-size="11.5" fill="#1B1714">scanners</text>
    <rect x="96" y="510" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="171" y="529" text-anchor="middle" font-size="11.5" fill="#1B1714">shard owner</text>
    <rect x="258" y="510" width="180" height="30" rx="6" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="348" y="529" text-anchor="middle" font-size="11.5" fill="#1B1714">pollers · sync-match</text>
    <rect x="96" y="552" width="342" height="30" rx="6" fill="#ECE8E0" stroke="#1B1714" stroke-opacity=".2"/>
    <text x="267" y="571" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" fill="#1B1714">tokeira-kernel — pure decision, no I/O</text>

    <!-- storage column -->
    <rect x="476" y="410" width="300" height="184" rx="8" fill="#F6F3EE" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="496" y="436" font-size="14" font-weight="700" fill="#1B1714">tokeira-storage</text>
    <text x="496" y="456" font-size="11.5" fill="#5C564E">fenced, atomic transitions</text>
    <rect x="496" y="468" width="260" height="30" rx="6" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="626" y="487" text-anchor="middle" font-size="11.5" fill="#1B1714">run repository — load · commit · read</text>
    <rect x="496" y="510" width="122" height="30" rx="6" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="557" y="529" text-anchor="middle" font-size="11.5" fill="#1B1714">reservoir</text>
    <rect x="630" y="510" width="126" height="30" rx="6" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="693" y="529" text-anchor="middle" font-size="11.5" fill="#1B1714">connections</text>
    <rect x="496" y="552" width="260" height="30" rx="6" fill="#FFFFFF" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="626" y="571" text-anchor="middle" font-size="11.5" fill="#1B1714">migrations — forward-only</text>

    <!-- DSQL -->
    <rect x="796" y="410" width="88" height="184" rx="8" fill="#B85C38" fill-opacity=".1" stroke="#B85C38" stroke-opacity=".55" stroke-width="1.4"/>
    <text x="840" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#9A4A2C">Aurora</text>
    <text x="840" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#9A4A2C">DSQL</text>
    <g fill="#B85C38">
      <rect x="812" y="490" width="56" height="9" rx="2.5" opacity=".28"/>
      <rect x="812" y="506" width="56" height="9" rx="2.5" opacity=".28"/>
      <rect x="812" y="522" width="56" height="9" rx="2.5" opacity=".28"/>
      <rect x="812" y="538" width="38" height="9" rx="2.5" opacity=".85"/>
    </g>
    <text x="840" y="570" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="9" fill="#9A4A2C">append-only</text>
    <path d="M776 500 H794" stroke="#B85C38" stroke-width="2.2" fill="none" marker-end="url(#arr)" stroke-linecap="round"/>

    <!-- runtime -> storage -->
    <path d="M456 500 H474" stroke="#B85C38" stroke-width="2.2" fill="none" marker-end="url(#arr)" stroke-linecap="round"/>

    <!-- footnotes row -->
    <rect x="76" y="612" width="460" height="58" rx="8" fill="#F6F3EE" stroke="#8A8378" stroke-opacity=".5" stroke-dasharray="4 4"/>
    <text x="96" y="636" font-size="11.5" font-weight="600" fill="#5C564E">Durable backstops — all in DSQL</text>
    <text x="96" y="654" font-size="10.5" fill="#5C564E">dispatch backlog · timer buckets · activity state · dedupe · shard leases</text>
    <rect x="556" y="612" width="328" height="58" rx="8" fill="#F6F3EE" stroke="#8A8378" stroke-opacity=".5" stroke-dasharray="4 4"/>
    <text x="576" y="636" font-size="11.5" font-weight="600" fill="#5C564E">DynamoDB — connection budget only</text>
    <text x="576" y="654" font-size="10.5" fill="#5C564E">rate limits and slot envelopes; never workflow state</text>
  </g>

  <path d="M480 692 V720" stroke="#8A8378" stroke-width="2" stroke-dasharray="4 5" fill="none" marker-end="url(#arrq)" stroke-linecap="round"/>
  <text x="497" y="712" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#8A8378">derived from history</text>

  <!-- PLANE 3 -->
  <g>
    <rect x="52" y="728" width="856" height="112" rx="10" fill="#FFFFFF" stroke="#8A8378" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="5 5"/>
    <text x="76" y="758" font-family="'SF Mono',Menlo,monospace" font-size="10.5" letter-spacing="1.8" fill="#8A8378">PLANE 3 · PROJECTION</text>
    <text x="76" y="782" font-size="15" font-weight="700" fill="#1B1714">tokeira-projection</text>
    <text x="76" y="802" font-size="12" fill="#5C564E">Read models, outside the correctness path.</text>
    <rect x="366" y="758" width="160" height="52" rx="7" fill="#F6F3EE" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="446" y="780" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1714">projection log</text>
    <text x="446" y="798" text-anchor="middle" font-size="10.5" fill="#5C564E">partitioned · replayable</text>
    <rect x="544" y="758" width="160" height="52" rx="7" fill="#F6F3EE" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="624" y="780" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1714">visibility store</text>
    <text x="624" y="798" text-anchor="middle" font-size="10.5" fill="#5C564E">SQL visibility · DSQL</text>
    <rect x="722" y="758" width="162" height="52" rx="7" fill="#F6F3EE" stroke="#1B1714" stroke-opacity=".14"/>
    <text x="803" y="780" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1714">rollups</text>
    <text x="803" y="798" text-anchor="middle" font-size="10.5" fill="#5C564E">sharded aggregates</text>
  </g>

  <!-- legend + mark -->
  <g font-size="11" fill="#5C564E">
    <line x1="52" y1="878" x2="84" y2="878" stroke="#B85C38" stroke-width="2.4" stroke-linecap="round"/>
    <text x="94" y="882">the commit path — authority</text>
    <line x1="290" y1="878" x2="322" y2="878" stroke="#8A8378" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
    <text x="332" y="882">derived — a lagging copy, never the record</text>
  </g>
  <!-- dandelion-seed corner mark -->
  <g transform="translate(884,868)" stroke="#B85C38" stroke-width="1.4" stroke-linecap="round" opacity=".8">
    <path d="M0 24 C2 14 4 8 8 0" fill="none"/>
    <g transform="translate(8,0)">
      <path d="M0 0 L8 -6 M0 0 L10 -1 M0 0 L8 5 M0 0 L3 -9 M0 0 L-3 -8" fill="none"/>
      <circle cx="0" cy="0" r="1.6" fill="#B85C38" stroke="none"/>
    </g>
  </g>
</svg>
