<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#e8eef7" stroke-width="1" opacity=".65"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".08"/></filter>
  <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".14"/></filter>
  <linearGradient id="band" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <linearGradient id="greenband" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="blueband" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  <marker id="arr_orange" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#ea580c"/></marker>
  <marker id="arr_purple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#7c3aed"/></marker>
  <marker id="arr_blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#2563eb"/></marker>
  <marker id="arr_cyan" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#0284c7"/></marker>
  <marker id="arr_green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#16a34a"/></marker>
  <marker id="arr_red" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#dc2626"/></marker>
  <marker id="arr_slate" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#475569"/></marker>
  <marker id="arr_yellow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#ca8a04"/></marker>
  <style>
    .title { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 40px; font-weight: 800; fill:#111827; letter-spacing:-.5px; }
    .subtitle { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 500; fill:#5b667a; }
    .section { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 900; fill:#5b667a; letter-spacing:2.2px; text-transform:uppercase; }
    .boxtitle { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 850; fill:#111827; }
    .subhead { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 800; fill:#334155; }
    .body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 500; fill:#475569; }
    .small { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill:#475569; }
    .tiny { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12.5px; font-weight: 600; fill:#64748b; }
    .code { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; font-weight: 650; fill:#334155; }
    .num { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 900; fill:white; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f7f9fc"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".55"/>
<text x="76" y="62" class="title">Tokeira Plane 3 — Failure &amp; Recovery</text>
<text x="76" y="96" class="subtitle">The safety story in one page: controller improves routing, but DSQL lease epochs fence ownership; edge retries are explicit; replacement runtimes recover</text>
<text x="76" y="124" class="subtitle">by loading authoritative history and hot state.</text>
<rect x="1970" y="30" width="350" height="76" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" opacity="1"/>
<text x="1996" y="62" class="tiny">
<tspan x="1996" dy="0">TOKEIRA</tspan>
<tspan x="1996" dy="18">Temporal-compatible runtime</tspan>
<tspan x="1996" dy="18">AWS-first / DSQL authority</tspan>
</text>
<rect x="76" y="175" width="2248" height="180" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3" filter="url(#shadow)" opacity="1"/>
<text x="108" y="213" class="section">Edge / SDK clients</text>
<rect x="76" y="383" width="2248" height="180" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow)" opacity="1"/>
<text x="108" y="421" class="section">Controller / placement</text>
<rect x="76" y="591" width="2248" height="180" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3" filter="url(#shadow)" opacity="1"/>
<text x="108" y="629" class="section">Runtime A  (old owner)</text>
<rect x="76" y="799" width="2248" height="180" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3" filter="url(#shadow)" opacity="1"/>
<text x="108" y="837" class="section">Aurora DSQL authority</text>
<rect x="76" y="1007" width="2248" height="180" rx="22" fill="#ecfdf5" stroke="#4ade80" stroke-width="1.3" filter="url(#shadow)" opacity="1"/>
<text x="108" y="1045" class="section">Runtime B  (takeover owner)</text>
<rect x="76" y="1215" width="2248" height="180" rx="22" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.3" filter="url(#shadow)" opacity="1"/>
<text x="108" y="1253" class="section">Workers + scanners</text>
<rect x="160" y="230" width="300" height="78" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.4" opacity="1"/>
<text x="180" y="262" class="subhead" fill="#ea580c">Routing snapshot</text>
<text x="180" y="290" class="small">
<tspan x="180" dy="0">bundle B42 → Runtime A</tspan>
<tspan x="180" dy="20">generation=128</tspan>
</text>
<rect x="540" y="230" width="360" height="78" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.4" opacity="1"/>
<text x="560" y="262" class="subhead" fill="#ea580c">Request admitted</text>
<text x="560" y="290" class="small">
<tspan x="560" dy="0">edge sends mutation / poll</tspan>
<tspan x="560" dy="20">to owner endpoint</tspan>
</text>
<rect x="1010" y="438" width="360" height="78" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.4" opacity="1"/>
<text x="1030" y="470" class="subhead" fill="#16a34a">Active owner</text>
<text x="1030" y="498" class="small">
<tspan x="1030" dy="0">lease epoch=71</tspan>
<tspan x="1030" dy="20">state=Active</tspan>
</text>
<rect x="1470" y="646" width="400" height="78" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4" opacity="1"/>
<text x="1490" y="678" class="subhead" fill="#2563eb">shard_lease row</text>
<text x="1490" y="706" class="small">
<tspan x="1490" dy="0">bundle=B42, owner=A</tspan>
<tspan x="1490" dy="20">epoch=71, expiry=t+30s</tspan>
</text>
<rect x="870" y="600" width="360" height="100" rx="18" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.8" filter="url(#shadow)" opacity="1"/>
<rect x="870" y="600" width="8" height="100" rx="4" fill="#dc2626"/>
<text x="898" y="642" class="boxtitle" fill="#111827">Failure event</text>
<text x="898" y="676" class="body">
<tspan x="898" dy="0">Runtime A loses DSQL connectivity or disappears; lease renewals stop.</tspan>
</text>
<path d="M1180 516 C1280 580 1280 630 1470 665" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_blue)" stroke-dasharray="8 7" opacity="0.86"/>
<circle cx="1325" cy="592" r="17" fill="#dc2626" stroke="white" stroke-width="4" filter="url(#smallShadow)"/>
<text x="1325" y="598" text-anchor="middle" class="num">1</text>
<path d="M1470 704 C1350 704 1260 678 1230 650" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_red)" stroke-dasharray="8 7" opacity="0.86"/>
<rect x="160" y="438" width="360" height="78" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.4" opacity="1"/>
<text x="180" y="470" class="subhead" fill="#ea580c">Transport failure</text>
<text x="180" y="498" class="small">
<tspan x="180" dy="0">connection reset / timeout</tspan>
<tspan x="180" dy="20">or NotShardOwner</tspan>
</text>
<path d="M900 270 C660 340 540 438 520 470" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_orange)" stroke-dasharray="8 7" opacity="0.86"/>
<circle cx="745" cy="360" r="17" fill="#ea580c" stroke="white" stroke-width="4" filter="url(#smallShadow)"/>
<text x="745" y="366" text-anchor="middle" class="num">2</text>
<rect x="600" y="438" width="330" height="78" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.4" opacity="1"/>
<text x="620" y="470" class="subhead" fill="#ea580c">Invalidate cache</text>
<text x="620" y="498" class="small">
<tspan x="620" dy="0">drop route for bundle B42</tspan>
<tspan x="620" dy="20">retry after fresh snapshot</tspan>
</text>
<path d="M520 470 H600" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_orange)" opacity="0.86"/>
<rect x="160" y="646" width="350" height="78" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" opacity="1"/>
<text x="180" y="678" class="subhead" fill="#475569">Heartbeats missing</text>
<text x="180" y="706" class="small">
<tspan x="180" dy="0">controller detects A stale</tspan>
<tspan x="180" dy="20">but does not decide truth</tspan>
</text>
<path d="M1190 478 C940 560 640 660 510 680" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_slate)" stroke-dasharray="8 7" opacity="0.86"/>
<circle cx="826" cy="588" r="17" fill="#475569" stroke="white" stroke-width="4" filter="url(#smallShadow)"/>
<text x="826" y="594" text-anchor="middle" class="num">3</text>
<rect x="590" y="646" width="350" height="78" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" opacity="1"/>
<text x="610" y="678" class="subhead" fill="#475569">Nominate B</text>
<text x="610" y="706" class="small">
<tspan x="610" dy="0">placement plan chooses candidate</tspan>
<tspan x="610" dy="20">then B must acquire lease</tspan>
</text>
<path d="M510 685 H590" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_slate)" opacity="0.86"/>
<rect x="1470" y="758" width="400" height="78" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4" opacity="1"/>
<text x="1490" y="790" class="subhead" fill="#2563eb">Lease expires</text>
<text x="1490" y="818" class="small">
<tspan x="1490" dy="0">t &gt; lease_expiry</tspan>
<tspan x="1490" dy="20">old epoch is no longer valid</tspan>
</text>
<path d="M1670 724 V758" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_blue)" opacity="0.86"/>
<circle cx="1700" cy="742" r="17" fill="#2563eb" stroke="white" stroke-width="4" filter="url(#smallShadow)"/>
<text x="1700" y="748" text-anchor="middle" class="num">4</text>
<rect x="980" y="854" width="390" height="84" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="1.4" opacity="1"/>
<text x="1000" y="886" class="subhead" fill="#16a34a">try_acquire_bundle(B42)</text>
<text x="1000" y="914" class="small">
<tspan x="1000" dy="0">conditional DSQL transaction</tspan>
<tspan x="1000" dy="20">updates owner=B, epoch=72</tspan>
</text>
<path d="M940 685 C980 745 1075 802 1170 854" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_green)" opacity="0.86"/>
<circle cx="1045" cy="780" r="17" fill="#16a34a" stroke="white" stroke-width="4" filter="url(#smallShadow)"/>
<text x="1045" y="786" text-anchor="middle" class="num">5</text>
<path d="M1370 896 C1430 870 1525 830 1670 836" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_blue)" opacity="0.86"/>
<rect x="1470" y="870" width="400" height="78" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4" opacity="1"/>
<text x="1490" y="902" class="subhead" fill="#2563eb">Fenced ownership</text>
<text x="1490" y="930" class="small">
<tspan x="1490" dy="0">owner=B, epoch=72</tspan>
<tspan x="1490" dy="20">old writes from A rejected</tspan>
</text>
<circle cx="1445" cy="870" r="17" fill="#2563eb" stroke="white" stroke-width="4" filter="url(#smallShadow)"/>
<text x="1445" y="876" text-anchor="middle" class="num">6</text>
<rect x="980" y="974" width="390" height="78" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="1.4" opacity="1"/>
<text x="1000" y="1006" class="subhead" fill="#16a34a">Recover bundle</text>
<text x="1000" y="1034" class="small">
<tspan x="1000" dy="0">load workflow_hot + history</tspan>
<tspan x="1000" dy="20">rebuild in-memory lane state</tspan>
</text>
<path d="M1670 948 C1550 980 1430 1010 1370 1008" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_blue)" opacity="0.86"/>
<circle cx="1515" cy="980" r="17" fill="#2563eb" stroke="white" stroke-width="4" filter="url(#smallShadow)"/>
<text x="1515" y="986" text-anchor="middle" class="num">7</text>
<rect x="1480" y="1182" width="390" height="78" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.4" opacity="1"/>
<text x="1500" y="1214" class="subhead" fill="#7c3aed">resume scanners</text>
<text x="1500" y="1242" class="small">
<tspan x="1500" dy="0">timer bucket + WFT timeout</tspan>
<tspan x="1500" dy="20">scanner commands re-enter lanes</tspan>
</text>
<path d="M1175 1052 C1280 1160 1380 1210 1480 1225" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_purple)" opacity="0.86"/>
<circle cx="1305" cy="1143" r="17" fill="#7c3aed" stroke="white" stroke-width="4" filter="url(#smallShadow)"/>
<text x="1305" y="1149" text-anchor="middle" class="num">8</text>
<rect x="600" y="230" width="300" height="78" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.4" opacity="1"/>
<text x="620" y="262" class="subhead" fill="#ea580c">Fresh route</text>
<text x="620" y="290" class="small">
<tspan x="620" dy="0">bundle B42 → Runtime B</tspan>
<tspan x="620" dy="20">generation=129</tspan>
</text>
<path d="M775 516 C750 410 745 330 750 308" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_orange)" opacity="0.86"/>
<circle cx="735" cy="392" r="17" fill="#ea580c" stroke="white" stroke-width="4" filter="url(#smallShadow)"/>
<text x="735" y="398" text-anchor="middle" class="num">9</text>
<rect x="1620" y="230" width="300" height="78" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.4" opacity="1"/>
<text x="1640" y="262" class="subhead" fill="#ea580c">Requests continue</text>
<text x="1640" y="290" class="small">
<tspan x="1640" dy="0">edge retries to B</tspan>
<tspan x="1640" dy="20">no split-brain mutation path</tspan>
</text>
<path d="M900 270 C1150 245 1420 245 1620 260" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_orange)" opacity="0.86"/>
<rect x="420" y="854" width="410" height="84" rx="14" fill="#ffffff" stroke="#fecdd3" stroke-width="1.4" opacity="1"/>
<text x="440" y="886" class="subhead" fill="#dc2626">stale A write attempt</text>
<text x="440" y="914" class="small">
<tspan x="440" dy="0">epoch=71 compare fails</tspan>
<tspan x="440" dy="20">commit rejected before becoming history</tspan>
</text>
<path d="M1010 500 C820 610 680 760 650 854" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_red)" stroke-dasharray="8 7" opacity="0.86"/>
<path d="M830 896 C1030 900 1280 900 1470 910" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr_red)" stroke-dasharray="8 7" opacity="0.86"/>
<circle cx="870" cy="880" r="17" fill="#dc2626" stroke="white" stroke-width="4" filter="url(#smallShadow)"/>
<text x="870" y="886" text-anchor="middle" class="num">10</text>
<rect x="76" y="1430" width="2248" height="128" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" opacity="1"/>
<rect x="112" y="1460" width="510" height="70" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" opacity="1"/>
<text x="132" y="1492" class="subhead" fill="#475569">Safety invariant</text>
<text x="132" y="1520" class="small">
<tspan x="132" dy="0">Only the holder of the current DSQL lease epoch may commit history.</tspan>
</text>
<rect x="657" y="1460" width="510" height="70" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" opacity="1"/>
<text x="677" y="1492" class="subhead" fill="#475569">Liveness mechanism</text>
<text x="677" y="1520" class="small">
<tspan x="677" dy="0">Controller + edge retry accelerate discovery of the new owner.</tspan>
</text>
<rect x="1202" y="1460" width="510" height="70" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" opacity="1"/>
<text x="1222" y="1492" class="subhead" fill="#475569">Recovery mechanism</text>
<text x="1222" y="1520" class="small">
<tspan x="1222" dy="0">Replacement owner reconstructs truth from DSQL, not from peer memory.</tspan>
</text>
<rect x="1747" y="1460" width="510" height="70" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" opacity="1"/>
<text x="1767" y="1492" class="subhead" fill="#475569">Operational signal</text>
<text x="1767" y="1520" class="small">
<tspan x="1767" dy="0">Route churn, lease acquire latency, stale write rejects, and scanner lag become first-class metrics.</tspan>
</text>
</svg>