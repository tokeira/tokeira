[package]
name = "tokeira-compose-deployment"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
askama = "0.12"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts = "1"
async-trait.workspace = true
bollard.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokeira-compose = { path = "../../crates/tokeira-compose" }
tokeira-config.workspace = true
tokeira-deploy-engine = { path = "../../crates/tokeira-deploy-engine" }
tokeira-aws.workspace = true
tokeira-iac = { path = "../../crates/tokeira-iac" }
tokeira-orchestrator = { path = "../../crates/tokeira-orchestrator" }
tokeira-state = { path = "../../crates/tokeira-state" }

[dev-dependencies]
proptest = "1"
tempfile.workspace = true
tokeira-observability = { path = "../../crates/tokeira-observability" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true
