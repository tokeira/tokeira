[package]
name = "tokeira-compose-deployment"
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.tokeira.platform]
id = "compose"
engine = "0.1.0"
default = false
# Seeded when `deployment create` names no --format; the package supplies
# peer seeds for both `tkd` and `tkdp`.
default-format = "tkd"

[dependencies]
tokeira-provisioner-cli = { workspace = true }
tokeira-provisioner = { workspace = true }
tokeira-platform = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokeira-compose = { path = "../../crates/tokeira-compose" }
tokeira-kinds = { path = "../../crates/tokeira-kinds" }
tokeira-orchestrator = { path = "../../crates/tokeira-orchestrator" }
tokeira-iac = { workspace = true }
tokeira-deploy-engine = { workspace = true }
tokeira-state = { path = "../../crates/tokeira-state" }
tokeira-config = { path = "../../crates/tokeira-config" }
tokeira-aws = { workspace = true }
aws-config = { version = "1", features = ["behavior-version-latest"] }
anyhow = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
futures-util = "0.3"
# Observability config rendering (owned by compose-syn — alerts + dashboards +
# the askama templates live in this crate).
askama = "0.12"
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokeira-tkd = { workspace = true }
tokeira-tkdp = { workspace = true }
tempfile = { workspace = true }
# The exercise test asserts the explanation model over the real engine outcome
# (evidence-model task 7.2).
tokeira-explain = { workspace = true }

[lints]
workspace = true
