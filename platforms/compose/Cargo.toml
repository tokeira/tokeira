[package]
name = "tokeira-compose-deployment"
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The catalog descriptor: how the build discovers this platform, and the
# definition format selected when none is requested. The definitions sit
# beside this file at each frontend's conventional relative path
# (definition.tkd, definition.tkdp) — catalog convention plus co-location is
# the whole platform-to-definition association.
[package.metadata.tokeira.platform]
id = "compose"
engine = "0.1.0"
default = false
# Seeded when `deployment create` names no --format; the package supplies
# peer seeds for both `tkd` and `tkdp`.
default-format = "tkd"

# The platform is description plus its own kinds: the definitions, their
# companion content (observability/), the descriptor above, one exported
# entry point, and the platform-owned observability kind that renders the
# companion content (src/observability.rs). The dependencies mirror that —
# the providers the entry point wires, the framework it speaks to, and the
# machinery the platform's own kind needs. The platform still defines no
# configuration types (the definition authors the shape) and hosts no
# pipeline (the framework owns it).
[dependencies]
tokeira-compose = { path = "../../crates/tokeira-compose" }
tokeira-aws = { workspace = true }
tokeira-provisioner-cli = { workspace = true }
# The platform-owned observability kind's machinery.
tokeira-platform = { workspace = true }
tokeira-iac = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
