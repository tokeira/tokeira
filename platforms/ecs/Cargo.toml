[package]
name = "tokeira-ecs-deployment"
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.tokeira.platform]
id = "ecs"
engine = "0.1.1"
default = false
# The Rust root is seeded when no format is requested; the Python root is a
# peer projection of the same modular definition and is selected explicitly.
default-format = "tkd"
definitions = ["deployment.tkd", "definition.tkdp"]
content = ["observability"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aws-sdk-ecs = "1"
chrono = { version = "0.4", features = ["serde"] }
dagger-sdk.workspace = true
futures-util = "0.3"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokeira-aws = { path = "../../crates/tokeira-aws" }
tokeira-build = { path = "../../crates/tokeira-build" }
tokeira-deploy-engine = { path = "../../crates/tokeira-deploy-engine" }
tokeira-ecs = { path = "../../crates/tokeira-ecs" }
tokeira-deployment = { workspace = true }
tokeira-iac = { path = "../../crates/tokeira-iac" }
tokeira-platform = { path = "../../crates/tokeira-platform" }
tokeira-platform-definition = { workspace = true, features = ["tkd", "tkdp"] }
tokio = { workspace = true, features = ["process", "signal", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokeira-observability = { workspace = true }

[lints]
workspace = true
