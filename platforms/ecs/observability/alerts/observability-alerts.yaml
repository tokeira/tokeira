groups:
  - name: tokeira-observability
    rules:
      - alert: DsqlReservoirExhaustion
        expr: tokeira_dsql_reservoir_utilization_ratio > 0.9
        for: 5m
        labels:
          severity: warning
          service: tokeirad
        annotations:
          summary: DSQL reservoir utilization is high
          description: DSQL ready connection capacity is close to exhaustion.
      - alert: DsqlOccConflictSpike
        expr: sum(rate(tokeira_storage_dsql_occ_conflict_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          service: tokeirad
        annotations:
          summary: DSQL OCC conflicts are elevated
          description: Storage commits are seeing sustained serialization conflicts.
      - alert: DsqlConnectionLeakDetected
        expr: sum(rate(tokeira_dsql_connection_leak_detected_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          service: tokeirad
        annotations:
          summary: DSQL connection leak suspected
          description: One or more DSQL checkouts exceeded the leak detection deadline.
      - alert: DsqlRateLimiterThrottling
        expr: sum(rate(tokeira_dsql_rate_limiter_throttled_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: tokeirad
        annotations:
          summary: DSQL connection creation is throttled
          description: Distributed DSQL rate limiting is delaying new connection creation.
      - alert: DsqlClassBudgetSaturation
        expr: max(tokeira_dsql_pool_class_in_use / clamp_min(tokeira_dsql_pool_class_budget_total, 1)) > 0.9
        for: 5m
        labels:
          severity: warning
          service: tokeirad
        annotations:
          summary: DSQL class budget is saturated
          description: A DSQL class budget is above its saturation threshold.
      - alert: ScrapeFailing
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          service: alloy
        annotations:
          summary: Telemetry scrape target is down
          description: Alloy cannot scrape one or more process or infrastructure targets.
      - alert: TelemetryIngestionStalled
        expr: sum(up) == 0
        for: 5m
        labels:
          severity: critical
          service: alloy
        annotations:
          summary: Telemetry ingestion appears stalled
          description: No scrape targets are reporting as up.
      - alert: ControllerGenerationCasFailures
        expr: sum(rate(tokeira_controller_generation_cas_total{outcome!="success"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: tokeira-controller
        annotations:
          summary: Controller generation CAS failures detected
          description: Placement generation writes are conflicting or failing.
      - alert: ControllerOwnershipChurnSpike
        expr: sum(rate(tokeira_controller_bundle_ownership_churn_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          service: tokeira-controller
        annotations:
          summary: Controller ownership churn is elevated
          description: Bundle ownership is changing at an unusual rate.
      - alert: AutoscalerStaleMetrics
        expr: sum(rate(tokeira_autoscaler_stale_metrics_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: tokeira-autoscaler
        annotations:
          summary: Autoscaler metrics are stale
          description: The autoscaler is suppressing decisions because input metrics are stale.
      - alert: AutoscalerActiveReconcilerAbsent
        expr: max(tokeira_autoscaler_active_reconciler_lease_held) < 1
        for: 2m
        labels:
          severity: critical
          service: tokeira-autoscaler
        annotations:
          summary: No autoscaler active reconciler is present
          description: No autoscaler instance currently holds the active reconciliation lease.
      - alert: ProjectionCheckpointLag
        expr: tokeira_projection_checkpoint_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
          service: tokeirad
        annotations:
          summary: Projection checkpoint lag is high
          description: Projection workers have not written a checkpoint recently.
      - alert: ProjectionSinkErrorRate
        expr: sum(rate(tokeira_projection_sink_error_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: tokeirad
        annotations:
          summary: Projection sink errors are occurring
          description: Projection sink writes are failing or being rejected.
