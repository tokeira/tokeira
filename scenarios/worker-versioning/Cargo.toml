[package]
name = "tokeira-scenario-worker-versioning"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone scenario project, excluded from the workspace (see the root Cargo.toml
# `exclude` list). It builds against the published Temporal Rust SDK the way a
# downstream consumer would — exercising Tokeira's Worker Deployment v2 routing
# end to end. See README.md for the flow and the run steps.
[dependencies]
temporalio-sdk = "0.2"
temporalio-sdk-core = "0.2"
temporalio-client = "0.2"
temporalio-common = "0.2"
temporalio-macros = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tonic = "0.14"
# The #[workflow]/#[activities] macros generate code that references these in scope.
futures-util = "0.3"
futures = "0.3"

# A versioned worker. Run one per version (build id + behaviour). Registers its
# (deployment, build_id) by polling, then executes whatever the server routes to it.
[[bin]]
name = "worker"
path = "src/worker.rs"

# The scenario driver. Waits for both workers, then drives current/ramping/promote and
# asserts the observed routing at each stage.
[[bin]]
name = "starter"
path = "src/starter.rs"
