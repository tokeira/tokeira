\* Two nodes, two runs, three epochs. The candidate protocol: epoch is a key
\* column, every run write reads the lease FOR KEY SHARE, renewal updates
\* only the expiry, and an owner stops at its own expiry. Expected: pass.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    None = None
    FirstOwner = n1
    Runs = {"r1", "r2"}
    InitialRuns = {"r1"}
    MaxEpoch = 3
    FenceRead = "keyshare"
    EpochIsKey = TRUE
    RenewForUpdate = FALSE
    SelfFence = TRUE

INVARIANTS
    TypeOK
    NoStaleOwnerCommit
    NoSpuriousAbort
    OneOwnerPerEpoch

PROPERTIES
    LapsedLeaseResolves

CHECK_DEADLOCK FALSE
