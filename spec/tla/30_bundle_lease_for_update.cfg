\* Run writes read the lease FOR UPDATE instead. That fence is safe, but
\* every renewal and every other commit conflicts with it, so NoSpuriousAbort
\* is not checked here. Expected: pass.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    None = None
    FirstOwner = n1
    Runs = {"r1", "r2"}
    InitialRuns = {"r1"}
    MaxEpoch = 3
    FenceRead = "forupdate"
    EpochIsKey = TRUE
    RenewForUpdate = FALSE
    SelfFence = TRUE

INVARIANTS
    TypeOK
    NoStaleOwnerCommit
    OneOwnerPerEpoch

PROPERTIES
    LapsedLeaseResolves

CHECK_DEADLOCK FALSE
