\* One run, two queue homes that may overlap, one poller, sticky incarnations,
\* and two environment faults per behavior.
SPECIFICATION Spec

CONSTANTS
    Runs = {r1}
    HeadRun = r1
    ServiceableRuns = {r1}
    Homes = {h1, h2}
    FirstHome = h1
    Pollers = {p1}
    StickyQueue = StickyQueue
    MaxInc = 3
    MaxFaults = 2
    Budget = 1
    StickyEnabled = TRUE
    LegacyWrites = FALSE
    CheckIncarnation = TRUE
    Discovery = "paged"
    ReconcileInserts = TRUE
    ReconcileDeletes = TRUE
    StickyTimeouts = TRUE

INVARIANTS
    TypeOK
    AtMostOneStartPerIncarnation
    NoStaleIncarnationStart
    NoStartWithoutIntent
    WantedRowsExist
    RowsAreWanted
    AtLeastOneHome

PROPERTIES
    EventuallyResolved
    StickyConverts

\* A closed run has nothing left to do; that is not a deadlock.
CHECK_DEADLOCK FALSE
