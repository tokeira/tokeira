\* Two runs in one queue. The head run's routing class has no poller, so its
\* row stays at the head; discovery must page past it to find the other run.
\* Expected: pass.
SPECIFICATION Spec

CONSTANTS
    Runs = {r1, r2}
    HeadRun = r1
    ServiceableRuns = {r2}
    Homes = {h1}
    FirstHome = h1
    Pollers = {p1}
    StickyQueue = StickyQueue
    MaxInc = 2
    MaxFaults = 1
    Budget = 1
    StickyEnabled = FALSE
    LegacyWrites = FALSE
    CheckIncarnation = TRUE
    Discovery = "paged"
    ReconcileInserts = TRUE
    ReconcileDeletes = TRUE
    StickyTimeouts = TRUE

INVARIANTS
    TypeOK
    AtMostOneStartPerIncarnation
    NoStaleIncarnationStart
    NoStartWithoutIntent
    WantedRowsExist
    RowsAreWanted
    AtLeastOneHome

PROPERTIES
    EventuallyResolved
    StickyConverts

CHECK_DEADLOCK FALSE
