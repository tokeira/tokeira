\* Acquisition repairs missing rows but leaves stale ones, and RowsAreWanted
\* is not checked. Stale dispatch rows cost only rejected offers, so
\* everything else still holds. Expected: pass.
SPECIFICATION Spec

CONSTANTS
    Runs = {r1}
    HeadRun = r1
    ServiceableRuns = {r1}
    Homes = {h1}
    FirstHome = h1
    Pollers = {p1}
    StickyQueue = StickyQueue
    MaxInc = 3
    MaxFaults = 2
    Budget = 1
    StickyEnabled = FALSE
    LegacyWrites = TRUE
    CheckIncarnation = TRUE
    Discovery = "paged"
    ReconcileInserts = TRUE
    ReconcileDeletes = FALSE
    StickyTimeouts = TRUE

INVARIANTS
    TypeOK
    AtMostOneStartPerIncarnation
    NoStaleIncarnationStart
    NoStartWithoutIntent
    WantedRowsExist
    AtLeastOneHome

PROPERTIES
    EventuallyResolved
    StickyConverts

CHECK_DEADLOCK FALSE
