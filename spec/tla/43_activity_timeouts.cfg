\* Two attempts, one heartbeat, no schedule-to-start timeout, and workers
\* that may act on a replayed start or lose a start's outcome.
SPECIFICATION Spec

CONSTANTS
    MaxTime = 5
    MaxAttempt = 2
    MaxBeats = 1
    Backoff = 0
    ScheduleToStart = 0
    StartToClose = 2
    Heartbeat = 1
    ScheduleToClose = 3
    Replays = TRUE
    WorkerFailures = TRUE
    CheckAttempt = TRUE
    CheckDeadline = TRUE
    RecheckAfterConflict = TRUE
    StaleKeepsTracking = TRUE
    OrderedUpdates = TRUE
    OrderedWorkerRetry = TRUE
    OrderedReload = TRUE
    UpdatesKeepRefresh = TRUE

INVARIANTS
    TypeOK
    StartedAttemptTracked
    StartedDeadlineTracked
    TimeoutForObservedAttempt
    TimeoutStillDue

\* The clock stops at MaxTime; a state with nothing left to do is not a deadlock.
CHECK_DEADLOCK FALSE
