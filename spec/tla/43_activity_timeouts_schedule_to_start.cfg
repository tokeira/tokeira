\* As the base configuration, with a schedule-to-start timeout no longer than
\* the started attempt's timeouts, so a start can race a schedule-to-start
\* timeout.
SPECIFICATION Spec

CONSTANTS
    MaxTime = 5
    MaxAttempt = 2
    MaxBeats = 1
    Backoff = 0
    ScheduleToStart = 1
    StartToClose = 2
    Heartbeat = 1
    ScheduleToClose = 3
    Replays = TRUE
    WorkerFailures = TRUE
    CheckAttempt = TRUE
    CheckDeadline = TRUE
    RecheckAfterConflict = TRUE
    StaleKeepsTracking = TRUE
    OrderedUpdates = TRUE
    OrderedWorkerRetry = TRUE
    OrderedReload = TRUE
    UpdatesKeepRefresh = TRUE

INVARIANTS
    TypeOK
    StartedAttemptTracked
    StartedDeadlineTracked
    TimeoutForObservedAttempt
    TimeoutStillDue

CHECK_DEADLOCK FALSE
