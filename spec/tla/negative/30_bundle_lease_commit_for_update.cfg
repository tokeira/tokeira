\* Negative control: run writes read the lease FOR UPDATE, so renewals abort
\* them. Expected: NoSpuriousAbort fails.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    None = None
    FirstOwner = n1
    Runs = {"r1", "r2"}
    InitialRuns = {"r1"}
    MaxEpoch = 3
    FenceRead = "forupdate"
    EpochIsKey = TRUE
    RenewForUpdate = FALSE
    SelfFence = TRUE

INVARIANTS
    TypeOK
    NoSpuriousAbort

CHECK_DEADLOCK FALSE
