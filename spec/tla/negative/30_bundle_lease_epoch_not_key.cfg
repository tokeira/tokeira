\* Negative control, today's schema: epoch belongs to no unique index, so a
\* takeover is a non-key update and FOR KEY SHARE doesn't conflict with it.
\* Expected: NoStaleOwnerCommit fails.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    None = None
    FirstOwner = n1
    Runs = {"r1", "r2"}
    InitialRuns = {"r1"}
    MaxEpoch = 3
    FenceRead = "keyshare"
    EpochIsKey = FALSE
    RenewForUpdate = FALSE
    SelfFence = TRUE

INVARIANTS
    TypeOK
    NoStaleOwnerCommit

CHECK_DEADLOCK FALSE
