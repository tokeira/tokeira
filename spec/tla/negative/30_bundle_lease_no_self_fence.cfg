\* Negative control: an owner keeps starting commits after its lease expires.
\* Each fenced commit that lands first aborts the takeover, so a takeover can
\* starve. Expected: LapsedLeaseResolves fails.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    None = None
    FirstOwner = n1
    Runs = {"r1", "r2"}
    InitialRuns = {"r1"}
    MaxEpoch = 3
    FenceRead = "keyshare"
    EpochIsKey = TRUE
    RenewForUpdate = FALSE
    SelfFence = FALSE

INVARIANTS
    TypeOK
    NoStaleOwnerCommit

PROPERTIES
    LapsedLeaseResolves

CHECK_DEADLOCK FALSE
