\* Negative control, today's commit and deletion: a plain SELECT of the epoch
\* inside the transaction. Under snapshot isolation it never conflicts with a
\* takeover. Expected: NoStaleOwnerCommit fails.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    None = None
    FirstOwner = n1
    Runs = {"r1", "r2"}
    InitialRuns = {"r1"}
    MaxEpoch = 3
    FenceRead = "plain"
    EpochIsKey = TRUE
    RenewForUpdate = FALSE
    SelfFence = TRUE

INVARIANTS
    TypeOK
    NoStaleOwnerCommit

CHECK_DEADLOCK FALSE
