\* Negative control, today's renewal: it reads the lease FOR UPDATE, which
\* DSQL treats as a write, so it conflicts with every fenced commit.
\* Expected: NoSpuriousAbort fails.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    None = None
    FirstOwner = n1
    Runs = {"r1", "r2"}
    InitialRuns = {"r1"}
    MaxEpoch = 3
    FenceRead = "keyshare"
    EpochIsKey = TRUE
    RenewForUpdate = TRUE
    SelfFence = TRUE

INVARIANTS
    TypeOK
    NoSpuriousAbort

CHECK_DEADLOCK FALSE
