\* Negative control, today's controller mode: the epoch is checked in its own
\* transaction before the commit. Expected: NoStaleOwnerCommit fails.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    None = None
    FirstOwner = n1
    Runs = {"r1", "r2"}
    InitialRuns = {"r1"}
    MaxEpoch = 3
    FenceRead = "separate"
    EpochIsKey = TRUE
    RenewForUpdate = FALSE
    SelfFence = TRUE

INVARIANTS
    TypeOK
    NoStaleOwnerCommit

CHECK_DEADLOCK FALSE
