\* Negative control: each discovery pass reads only the first Budget rows,
\* with no paging. The unservable head row hides the other run. Expected:
\* EventuallyResolved fails.
SPECIFICATION Spec

CONSTANTS
    Runs = {r1, r2}
    HeadRun = r1
    ServiceableRuns = {r2}
    Homes = {h1}
    FirstHome = h1
    Pollers = {p1}
    StickyQueue = StickyQueue
    MaxInc = 2
    MaxFaults = 1
    Budget = 1
    StickyEnabled = FALSE
    LegacyWrites = FALSE
    CheckIncarnation = TRUE
    Discovery = "bare"
    ReconcileInserts = TRUE
    ReconcileDeletes = TRUE
    StickyTimeouts = TRUE

INVARIANTS
    TypeOK
    AtMostOneStartPerIncarnation
    NoStaleIncarnationStart
    NoStartWithoutIntent
    WantedRowsExist
    RowsAreWanted
    AtLeastOneHome

PROPERTIES
    EventuallyResolved
    StickyConverts

CHECK_DEADLOCK FALSE
