\* Negative control: discovery continues after a durable cursor and never
\* returns to the head, so the run's next row, below the cursor, is never
\* read. Expected: EventuallyResolved fails.
SPECIFICATION Spec

CONSTANTS
    Runs = {r1}
    HeadRun = r1
    ServiceableRuns = {r1}
    Homes = {h1}
    FirstHome = h1
    Pollers = {p1}
    StickyQueue = StickyQueue
    MaxInc = 2
    MaxFaults = 1
    Budget = 1
    StickyEnabled = FALSE
    LegacyWrites = FALSE
    CheckIncarnation = TRUE
    Discovery = "cursor"
    ReconcileInserts = TRUE
    ReconcileDeletes = TRUE
    StickyTimeouts = TRUE

INVARIANTS
    TypeOK
    AtMostOneStartPerIncarnation
    NoStaleIncarnationStart
    NoStartWithoutIntent
    WantedRowsExist
    RowsAreWanted
    AtLeastOneHome

PROPERTIES
    EventuallyResolved
    StickyConverts

CHECK_DEADLOCK FALSE
