\* Negative control: the start transition doesn't check the incarnation.
\* Expected: AtMostOneStartPerIncarnation, NoStaleIncarnationStart or
\* NoStartWithoutIntent fails.
SPECIFICATION Spec

CONSTANTS
    Runs = {r1}
    HeadRun = r1
    ServiceableRuns = {r1}
    Homes = {h1, h2}
    FirstHome = h1
    Pollers = {p1}
    StickyQueue = StickyQueue
    MaxInc = 3
    MaxFaults = 2
    Budget = 1
    StickyEnabled = TRUE
    LegacyWrites = FALSE
    CheckIncarnation = FALSE
    Discovery = "paged"
    ReconcileInserts = TRUE
    ReconcileDeletes = TRUE
    StickyTimeouts = TRUE

INVARIANTS
    TypeOK
    AtMostOneStartPerIncarnation
    NoStaleIncarnationStart
    NoStartWithoutIntent
    WantedRowsExist
    RowsAreWanted
    AtLeastOneHome

PROPERTIES
    EventuallyResolved
    StickyConverts

CHECK_DEADLOCK FALSE
