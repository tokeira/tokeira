\* Negative control: a sticky incarnation's schedule-to-start timeout never
\* fires, so a lost notification strands it. Expected: StickyConverts fails.
SPECIFICATION Spec

CONSTANTS
    Runs = {r1}
    HeadRun = r1
    ServiceableRuns = {r1}
    Homes = {h1, h2}
    FirstHome = h1
    Pollers = {p1}
    StickyQueue = StickyQueue
    MaxInc = 3
    MaxFaults = 2
    Budget = 1
    StickyEnabled = TRUE
    LegacyWrites = FALSE
    CheckIncarnation = TRUE
    Discovery = "paged"
    ReconcileInserts = TRUE
    ReconcileDeletes = TRUE
    StickyTimeouts = FALSE

INVARIANTS
    TypeOK
    AtMostOneStartPerIncarnation
    NoStaleIncarnationStart
    NoStartWithoutIntent
    WantedRowsExist
    RowsAreWanted
    AtLeastOneHome

PROPERTIES
    StickyConverts

CHECK_DEADLOCK FALSE
