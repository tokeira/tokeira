\* Negative control: acquisition deletes stale rows but doesn't insert
\* missing ones. Expected: WantedRowsExist fails.
SPECIFICATION Spec

CONSTANTS
    Runs = {r1}
    HeadRun = r1
    ServiceableRuns = {r1}
    Homes = {h1}
    FirstHome = h1
    Pollers = {p1}
    StickyQueue = StickyQueue
    MaxInc = 3
    MaxFaults = 2
    Budget = 1
    StickyEnabled = FALSE
    LegacyWrites = TRUE
    CheckIncarnation = TRUE
    Discovery = "paged"
    ReconcileInserts = FALSE
    ReconcileDeletes = TRUE
    StickyTimeouts = TRUE

INVARIANTS
    TypeOK
    AtMostOneStartPerIncarnation
    NoStaleIncarnationStart
    NoStartWithoutIntent
    WantedRowsExist
    RowsAreWanted
    AtLeastOneHome

PROPERTIES
    EventuallyResolved
    StickyConverts

CHECK_DEADLOCK FALSE
