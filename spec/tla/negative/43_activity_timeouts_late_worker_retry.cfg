\* Negative control: a worker retry's update applies whenever the entry
\* exists, so a late one clears the next attempt's start.
\* Expected: StartedDeadlineTracked fails.
SPECIFICATION Spec

CONSTANTS
    MaxTime = 5
    MaxAttempt = 2
    MaxBeats = 1
    Backoff = 0
    ScheduleToStart = 0
    StartToClose = 2
    Heartbeat = 1
    ScheduleToClose = 3
    Replays = TRUE
    WorkerFailures = TRUE
    CheckAttempt = TRUE
    CheckDeadline = TRUE
    RecheckAfterConflict = TRUE
    StaleKeepsTracking = TRUE
    OrderedUpdates = TRUE
    OrderedWorkerRetry = FALSE
    OrderedReload = TRUE
    UpdatesKeepRefresh = TRUE

INVARIANTS
    StartedDeadlineTracked

CHECK_DEADLOCK FALSE
