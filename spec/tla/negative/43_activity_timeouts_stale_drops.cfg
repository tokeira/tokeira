\* Negative control: a stale rejection removes the entry instead of
\* requesting a reload. Expected: StartedAttemptTracked fails.
SPECIFICATION Spec

CONSTANTS
    MaxTime = 5
    MaxAttempt = 2
    MaxBeats = 1
    Backoff = 0
    ScheduleToStart = 0
    StartToClose = 2
    Heartbeat = 1
    ScheduleToClose = 3
    Replays = TRUE
    WorkerFailures = TRUE
    CheckAttempt = TRUE
    CheckDeadline = TRUE
    RecheckAfterConflict = TRUE
    StaleKeepsTracking = FALSE
    OrderedUpdates = TRUE
    OrderedWorkerRetry = TRUE
    OrderedReload = TRUE
    UpdatesKeepRefresh = TRUE

INVARIANTS
    StartedAttemptTracked

CHECK_DEADLOCK FALSE
