\* Negative control: the start's update applies only under the revision it
\* read after its load, and the heartbeat's update sets only the heartbeat
\* time. A heartbeat from a worker that learned the start from a replayed
\* request drops the start's update. Expected: StartedDeadlineTracked fails.
SPECIFICATION Spec

CONSTANTS
    MaxTime = 5
    MaxAttempt = 2
    MaxBeats = 1
    Backoff = 0
    ScheduleToStart = 0
    StartToClose = 2
    Heartbeat = 1
    ScheduleToClose = 3
    Replays = TRUE
    WorkerFailures = TRUE
    CheckAttempt = TRUE
    CheckDeadline = TRUE
    RecheckAfterConflict = TRUE
    StaleKeepsTracking = TRUE
    OrderedUpdates = FALSE
    OrderedWorkerRetry = TRUE
    OrderedReload = TRUE
    UpdatesKeepRefresh = TRUE

INVARIANTS
    StartedDeadlineTracked

CHECK_DEADLOCK FALSE
