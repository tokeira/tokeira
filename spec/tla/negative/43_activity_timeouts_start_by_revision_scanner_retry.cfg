\* Negative control: as start_by_revision, with workers that act only on a
\* start's reply and never fail. The scanner's retry update drops the next
\* attempt's start update. Schedule-to-close is long enough that the
\* attempt's own deadlines come first. Expected: StartedDeadlineTracked fails.
SPECIFICATION Spec

CONSTANTS
    MaxTime = 5
    MaxAttempt = 2
    MaxBeats = 1
    Backoff = 0
    ScheduleToStart = 0
    StartToClose = 2
    Heartbeat = 1
    ScheduleToClose = 5
    Replays = FALSE
    WorkerFailures = FALSE
    CheckAttempt = TRUE
    CheckDeadline = TRUE
    RecheckAfterConflict = TRUE
    StaleKeepsTracking = TRUE
    OrderedUpdates = FALSE
    OrderedWorkerRetry = TRUE
    OrderedReload = TRUE
    UpdatesKeepRefresh = TRUE

INVARIANTS
    StartedDeadlineTracked

CHECK_DEADLOCK FALSE
