\* Negative control: every applied update clears a requested reload, so an
\* earlier image's update cancels the full pass's repair of a lost start.
\* Expected: StartedDeadlineTracked fails.
SPECIFICATION Spec

CONSTANTS
    MaxTime = 5
    MaxAttempt = 2
    MaxBeats = 1
    Backoff = 0
    ScheduleToStart = 0
    StartToClose = 2
    Heartbeat = 1
    ScheduleToClose = 3
    Replays = TRUE
    WorkerFailures = TRUE
    CheckAttempt = TRUE
    CheckDeadline = TRUE
    RecheckAfterConflict = TRUE
    StaleKeepsTracking = TRUE
    OrderedUpdates = TRUE
    OrderedWorkerRetry = TRUE
    OrderedReload = TRUE
    UpdatesKeepRefresh = FALSE

INVARIANTS
    StartedDeadlineTracked

CHECK_DEADLOCK FALSE
