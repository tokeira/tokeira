[package]
name = "spike-connect-buffa"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
async-stream = "0.3"
buffa = { version = "0.6", features = ["json"] }
buffa-types = { version = "0.6", features = ["json"] }
connectrpc = { version = "0.6", features = ["server", "client", "axum"] }
bytes = "1"
futures = "0.3"
http-body = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
connectrpc-build = "0.6"
