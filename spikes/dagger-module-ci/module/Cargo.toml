# Pre-authored so initialization amends this manifest instead of rendering its
# bare template: the engine's `new_manifest` omits the `[workspace]` guard, so a
# module initialized inside a parent cargo workspace (this repository) fails
# `cargo generate-lockfile` with "current package believes it's in a workspace
# when it's not" — rust.4 rerun finding; see ../README.md.
[package]
name = "ci"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace]

[dependencies]
dagger-sdk = { git = "https://github.com/iw/dagger", rev = "620c646ce23110c85c1a5f5866141a9c1028e4fc" }
tokio = { version = "1.35.1", default-features = false, features = ["rt", "net", "time"] }
