[package]
name = "tokeira-temporal-sdk-v0-7-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Standalone root: the product workspace excludes this directory, and from a nested
# worktree cargo would otherwise keep searching upward and refuse to build it.
[workspace]

[dependencies]
anyhow = "1.0.103"
futures = "0.3"
temporalio-client = { version = "=0.8.0", default-features = false }
temporalio-common = { version = "=0.8.0", default-features = false }
temporalio-macros = "=0.8.0"
temporalio-sdk = { version = "=0.8.0", default-features = false }
temporalio-workflow = "=0.8.0"
tokeira-config = { path = "../../crates/tokeira-config" }
tokeira-engine = { path = "../../crates/tokeira-engine" }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "time"] }
