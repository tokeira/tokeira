[package]
name = "proto-sync"
publish = false
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Vendor Temporal API protos and regenerate tokeira-proto's checked-in bindings"

[dependencies]
anyhow = "1"
# Pinned to the exact codegen stack the checked-in `tokeira-proto` bindings were
# produced with; bumping any of these changes generated output and requires a
# regen. `protox` compiles the vendored protos in pure Rust, so no `protoc` is
# needed on the machine that regenerates.
connectrpc-build = "0.6"
prost = "0.14"
prost-types = "0.14"
protox = "0.9"
tonic-prost-build = "0.14"
walkdir = "2"

[lints]
workspace = true
