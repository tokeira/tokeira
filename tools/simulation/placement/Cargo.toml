[package]
name = "placement-sim"
version = "0.1.0"
edition = "2021"
publish = false
description = "Discrete-event simulator for Tokeira placement/membership invariants"

[[bin]]
name = "placement-sim"
path = "src/main.rs"

[lib]
name = "placement_sim"
path = "src/lib.rs"

[dependencies]
sim-engine = { path = "../engine" }

[dev-dependencies]
proptest = "1"
